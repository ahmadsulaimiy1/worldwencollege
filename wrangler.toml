name = "al-madinah-college"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# The site is static. There is no database binding and no object store,
# because there is nothing server-side to bind to: the prospectus, the
# Regulations, the schedule of charges and the disclosure are documents, and
# the Riwāq keeps a student's ḥifẓ ledger in their own browser
# (docs/al-madinah/editorial-bible.md, EB §10.3).
#
# The WEC-LC configuration this replaces — a D1 database, an R2 bucket for
# learner recordings, and the 101-file /api/ layer behind them — is archived
# at archive/wec-lc/wrangler.toml together with the code it bound. It was not
# carried over: deploying it here would have published WEC's authentication
# and admin-enrolment endpoints on this College's domain, which is the same
# mistake as serving WEC's home page at this College's root.
#
# When the Riwāq does need a server — so that a student's record survives a
# cleared browser, which is the honest limitation the interface states today —
# it gets its own binding, its own schema, and its own review. It does not
# inherit one.

# ── BEFORE THE FIRST DEPLOY ──────────────────────────────────────────
# `pages_build_output_dir = "."` publishes the whole repository, so
# rusukh-src/, docs/, scripts/ and archive/ would all be fetchable as static
# files on the live domain. That is fine for a repository of documents and
# wrong for a college's own planning papers. Resolve it before the domain is
# attached — either by building into a dedicated output directory, or by
# excluding the source trees at upload — and not by assuming the platform
# hides them.
