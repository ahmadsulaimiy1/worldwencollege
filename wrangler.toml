name = "wec-lc"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# D1 database binding. `database_id` is a placeholder — replace it
# with a real id after running:
#   wrangler d1 create wec-lc
#   wrangler d1 execute wec-lc --remote --file=sql/schema.sql
# Nothing in this repo has been run against a real D1 database yet.
[[d1_databases]]
binding = "DB"
database_name = "wec-lc"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# Secrets (Stripe/Paystack/Flutterwave/Opay keys, Clerk keys, Resend
# key) are deliberately NOT set here — wrangler.toml is committed to
# git. Set them with `wrangler pages secret put <NAME>` once real
# credentials exist. See .env.example for the full list and
# docs/technical-architecture.md § Deployment for the setup sequence.
