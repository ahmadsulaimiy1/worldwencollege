name = "wec-lc"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# D1 database binding. `database_id` is a placeholder — replace it
# with a real id after running:
#   wrangler d1 create wec-lc
#   wrangler d1 execute wec-lc --remote --file=sql/schema.sql
# Nothing in this repo has been run against a real D1 database yet.
[[d1_databases]]
binding = "DB"
database_name = "wec-lc"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# Object storage for learner voice recordings. The bucket is PRIVATE and
# must stay private — nothing in the application ever hands out a public
# or signed URL for it. Playback goes through
# /api/lms/recording/audio, which authorises every request against the
# same rules as the rest of the LMS. See
# functions/_lib/lms/recording-storage.js and
# docs/audio-platform-architecture.md § 4.
#
# Create it once with:
#   wrangler r2 bucket create wec-lc-recordings
# (the deploy workflow does this automatically if it is missing)
[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "wec-lc-recordings"

# Secrets (Stripe/Paystack/Flutterwave/Opay keys, Clerk keys, Resend
# key) are deliberately NOT set here — wrangler.toml is committed to
# git. Set them with `wrangler pages secret put <NAME>` once real
# credentials exist. See .env.example for the full list and
# docs/technical-architecture.md § Deployment for the setup sequence.
