    <h1>بوابة الكلية التعليمية</h1>
    <p class="lede">سُمِّي بالرواق الذي تُعقد فيه الحلقة. يقرأ الطالب، ويصحِّح المعلم،

      تُسجّله يبقى على جهازك ولا يُرسل إلى أي مكان &mdash; وهو حدٌّ نذكره ولا نخفيه.</p>
