<!--  THE STRIP THAT USED TO BE HERE IS GONE.

      It carried an address, a standing line, Calendar, Verify, Sign in,
      Personalise and the language switch — seven items of seven different
      lengths, stacked ABOVE the College's own name. A masthead is the
      first thing a reader sees and it was being preceded by a row of
      utilities, which is the opposite of how a serious institution
      presents itself.

      Every one of them still exists. Calendar, Verify and Contact live in
      the mega-menus and the footer; Sign in, Apply, WhatsApp and
      Personalise moved to the floating dock (partials/dock.html); the
      language switch sits in the header's own action group; and the whole
      set is in the mobile drawer under Full Menu.

      What remains above the name is the prayer band alone — the one thing
      a college of Qur'ānic sciences has a reason to put there.  -->

<!-- THE PRAYER BAND.
     The one thing a college of Qur'ānic sciences should carry above its
     own name. Times are computed on the reader's device from the solar
     position at Lagos — Muslim World League angles, shadow factor one —
     and the band says so, because reasonable tables differ and a school
     that prints a prayer time without naming its convention is asserting
     more than it knows. -->
<div class="prayerband" data-prayer-band>
  <div class="prayerband__inner">
    <span class="prayerband__place">
      <svg class="icon" aria-hidden="true"><use href="#i-minaret"/></svg>
      لاغوس &middot; توقيت غرب أفريقيا
    </span>
    <span class="prayerband__next">
      <span class="prayerband__label">التالية</span>
      <strong data-prayer-name>—</strong>
      <span class="prayerband__time" data-prayer-time>—:—</span>
      <span class="prayerband__cd" data-prayer-countdown></span>
    </span>
    <span class="prayerband__date">
      <span data-hijri-long>—</span>
      <span class="prayerband__sep" aria-hidden="true">&middot;</span>
      <span data-gregorian>—</span>
    </span>
  </div>
</div>

<!-- THE PERSONALISATION CENTRE.
     Three settings, remembered on this device and nowhere else. الحِلية
     recolours the institutional blues without touching the golds; ornament
     governs the raking light, the drifting motes and the paper grain;
     text size scales the whole document from the root. -->
<div class="personalise crystal" id="personalise" data-personalise-panel hidden>
  <div class="personalise__inner">
    <div class="personalise__head">
      <h2 class="personalise__title">تخصيص الموقع</h2>
      <button type="button" class="personalise__close" data-personalise-close aria-label="Close">&times;</button>
    </div>

    <div class="personalise__group">
      <p class="personalise__label">الحِلية</p>
      <div class="personalise__opts">
        <button type="button" data-pref="livery" data-value="sapphire" aria-pressed="true">الياقوت</button>
        <button type="button" data-pref="livery" data-value="obsidian" aria-pressed="false">السَّبَج</button>
        <button type="button" data-pref="livery" data-value="emerald" aria-pressed="false">الزمرد</button>
      </div>
    </div>

    <div class="personalise__group">
      <p class="personalise__label">الزخرفة</p>
      <div class="personalise__opts">
        <button type="button" data-pref="ornament" data-value="full" aria-pressed="true">كاملة</button>
        <button type="button" data-pref="ornament" data-value="restrained" aria-pressed="false">مقتصدة</button>
        <button type="button" data-pref="ornament" data-value="none" aria-pressed="false">بلا</button>
      </div>
    </div>

    <div class="personalise__group">
      <p class="personalise__label">حجم الخط</p>
      <div class="personalise__opts">
        <button type="button" data-pref="textsize" data-value="small" aria-pressed="false">صغير</button>
        <button type="button" data-pref="textsize" data-value="medium" aria-pressed="true">عادي</button>
        <button type="button" data-pref="textsize" data-value="large" aria-pressed="false">كبير</button>
      </div>
    </div>

    <p class="personalise__note">Remembered on this device. Nothing is sent anywhere,
      and no account is required.</p>
  </div>
</div>
