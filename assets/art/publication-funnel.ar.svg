  <title id="publication-funnel-title">من السجل إلى الرف، والبوابة في نهايته</title>
  <desc id="publication-funnel-desc">قمع من ثلاث مراحل. السجل خلف مطبعة الكلية يضم أربعة وسبعين موردًا مرشّحًا. وأُنتج أحد عشر مجلّدًا للقرّاء، ومجلّدان إضافيان للاستخدام الداخلي. والفارق بين الأربعة والسبعين والأحد عشر مقصود: المطبعة تعمل بقاعدة ثابتة ألا تنشر لرفع العدد، وقد سُحب عنوانان مخطَّطان رسميًا بموجبها، والسحب مسجَّل لا منسي. أما المرحلة الثالثة فصفر: لم يُعيَّن مراجع أكاديمي، فلم يُقرأ أي مجلّد قراءة مستقلة عمّن كتبوه، والبوابة إلى تلك المرحلة مرسومة مغلقة.</desc>
