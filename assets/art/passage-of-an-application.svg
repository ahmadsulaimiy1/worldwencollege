  <title id="passage-of-an-application-title">The five stages of an application, drawn by whose act each one is</title>
  <desc id="passage-of-an-application-desc">Stage 1, Estimate your level: the applicant’s (You, in about thirty seconds). Stage 2, Submit the form: the applicant’s (You). Stage 3, Placement: the College’s (A person, not the platform). Stage 4, Offer: shared (Admissions, then you). Stage 5, Enrolment: shared (You and the platform together). The discs sit below the thread where the act is the applicant’s, above it where the act is the College’s, and on the thread itself where the stage genuinely belongs to both. The alternation is the point of the drawing: an applicant who can see which stages are not theirs can also see which ones they are entitled to chase.</desc>
