  <text x="450.0" y="420.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#8FA3C4">A number already spent is never reissued: a sitting struck out on appeal gives the attempt back and keeps its place in the order.</text>
