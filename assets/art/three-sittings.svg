  <title id="three-sittings-title">The three sittings a learner is allowed, the fourteen days between them, and what the regulations do after the third</title>
  <desc id="three-sittings-desc">One measured line with three marks on it: a first sitting and two resits. The distance drawn between each pair is the fourteen days the regulations require between sittings, labelled as such rather than left as decoration. Past the third mark the line does not stop at a wall — it passes under an arch, which is the instrument’s own provision that the level is repeated and the assessment is set afresh rather than sat a fourth time. Beneath the line are the three conditions that hold at every sitting: a mark earned at a resit counts to seventy, nothing is charged for a resit or for repeating a level, and a task first sat more than a year ago is set anew rather than reissued.</desc>
<text x="62.0" y="46.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">THREE SITTINGS</text>
  <text x="62.0" y="74.0" text-anchor="start" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#F2E3C0">A first sitting and two resits, a fortnight apart — and a door at the end, not a wall.</text>
