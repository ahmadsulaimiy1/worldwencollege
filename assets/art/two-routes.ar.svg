  <title id="two-routes-title">طريقان إلى الشهادة نفسها، وأين يُدفع ثمن المنح في كل منهما</title>
  <desc id="two-routes-desc">عمودان من الرسوم ينحدران إلى ختم واحد. العمود الأول طريق الملتحق: كتلة واحدة غير مجزّأة قدرها $3,166.67 للمستوى، والمنح داخلها، ولذلك لا يلقى الملتحق رسم تخرّج. وفي المستويات الستة يبلغ ذلك $19,000، وهو يشتري التدريس — أن يعلّمك إنسان. والعمود الثاني طريق المستقل، مرسوم في ثلاث قطع تُشترى منفصلة: الوصول إلى المستوى بـ $150، امتحان المستوى بـ $250، الشهادة وسجلها بـ $200. ومجموعها $600 للمستوى و$3,600 للمستويات الستة، ولا تشتري تدريسًا البتة. وينحدر العمودان إلى ختم واحد في الأسفل، لأن الامتحان والشهادة والقيد في السجل واحدة في الطريقين. وكل ما يفترق بينهما فوق الختم، ولا شيء يفترق تحته. والعمودان مرسومان بارتفاع واحد لأنهما يبيّنان مِمَّ يتركّب كل رسم لا كم يبلغ.</desc>
  <text x="808.0" y="52.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧طريقان، وشهادة واحدة⁩</text>
  <text x="808.0" y="80.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="14" fill="#8FA3C4">⁧ما يفرّق بين السعرين ليس الشهادة، بل أن يعلّمك إنسان أو لا يعلّمك.⁩</text>
  <text data-pop="" x="650.0" y="136.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="15" font-weight="700" fill="#F2E3C0">⁧الملتحق⁩</text>
  <text data-pop="" x="650.0" y="160.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11.5" fill="#8FA3C4" opacity="0.9">⁧يعلّمك إنسان⁩</text>
  <text data-pop="" x="250.0" y="136.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="15" font-weight="700" fill="#F2E3C0">⁧المستقل⁩</text>
  <text data-pop="" x="250.0" y="160.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11.5" fill="#8FA3C4" opacity="0.9">⁧لا أحد يعلّمك⁩</text>
