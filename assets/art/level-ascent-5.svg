  <title id="level-ascent-5-title">Level V on the ascent — and every rung a complete award</title>
  <desc id="level-ascent-5-desc">A stair of six rungs, each one higher than the last. Every rung is a level of the programme, marked with its roman numeral, its CEFR band and the post-nominal of its award. The rung circled in gold is Level V at C1, which is what this page is about, and its award is the English Orator of Worldwide English College. The other rungs are I at A1, II at A2, III at B1, IV at B2, VI at C2. Every rung is drawn at the same weight: this is not a progress bar and it says nothing about the reader. Each rung is a complete award with its own entry standard, its own exit standard and its own title, so a learner who stops at one holds a finished qualification rather than an abandoned course.</desc>
