  <title id="the-three-rungs-title">The three stages of an appeal, drawn as a stair climbing away from the decision being appealed</title>
  <desc id="the-three-rungs-desc">A stair of three rungs rising away from a single block at the foot, which is the decision being appealed. The first rung is heard by a member of academic staff senior to, and other than, the person who took that decision, and is answered within ten working days. The second is heard by the Academic Senate, which sets standards and marks no work, within twenty. The third is heard by a Governor, and no member of the Executive sits on the Board; the College publishes no interval for it and holds itself to twenty working days instead, which the plate labels as self-binding rather than published. Each rung stands further from the original decision than the one below it, which is the rule the whole procedure is built on drawn as distance.</desc>
<text x="62.0" y="46.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">THE THREE RUNGS</text>
  <text x="62.0" y="74.0" text-anchor="start" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#F2E3C0">At every stage the decision passes to somebody who was not part of the last one.</text>
