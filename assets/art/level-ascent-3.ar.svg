  <title id="level-ascent-3-title">المستوى III في سُلَّم البرنامج — وكل درجة شهادة كاملة</title>
  <desc id="level-ascent-3-desc">سُلَّم من ست درجات ترتفع درجةً درجة. كل درجة مستوى من مستويات البرنامج، وعليها رقمها الروماني، وسِمَتها في الإطار الأوروبي المرجعي، ورمز شهادتها. الدرجة المحدَّدة بحلقة ذهبية هي المستوى III عند B1، وهو موضوع هذه الصفحة، وشهادته English Associate of Worldwide English College. والدرجات الأخرى هي I عند A1، II عند A2، IV عند B2، V عند C1، VI عند C2. والدرجات كلها مرسومة بالثقل نفسه: هذه ليست شريط تقدُّم، ولا تقول عن القارئ شيئًا. كل درجة شهادة كاملة لها معيار دخولها ومعيار خروجها وعنوانها الخاص، فمن وقف عند واحدة يحمل شهادة تامة لا مسارًا مهجورًا.</desc>
  <text x="808.0" y="50.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧السُّلَّم⁩</text>
  <text x="808.0" y="74.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="11" font-weight="700" fill="#E7C97A">⁧هذه الصفحة · المستوى III⁩</text>
