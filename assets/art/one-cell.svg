  <title id="one-cell-title">One cell of the engagement grid taken apart into evidence, the platform’s reading, and a correction written over it</title>
  <desc id="one-cell-desc">Three layers of one object rather than three separate boxes. At the base, the evidence the server produced: study time it measured, an assessment attempted, a live session a host confirmed, a lesson completed, and laboratory practice submitted — each carrying the clause it counts under. Above it, the state the platform derived from that evidence, which is what a cell shows when nobody has touched it. On top, a state written by a member of staff, drawn inset and semi-transparent so the reading underneath stays legible through it. That is the drawing’s argument and the module’s rule: a correction never conceals what it corrected, and both readings stay on the record with the reason given for the change. The whole cell measures one seven-day window, anchored to the learner’s own start date rather than to a calendar week.</desc>
