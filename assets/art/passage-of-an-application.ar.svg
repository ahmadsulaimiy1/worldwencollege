  <title id="passage-of-an-application-title">مراحل الطلب الخمس، مرسومةً بحسب صاحب كل فعل</title>
  <desc id="passage-of-an-application-desc">المرحلة 1، قدِّر مستواك: على المتقدّم (أنت، في نحو ثلاثين ثانية). المرحلة 2، أرسِل النموذج: على المتقدّم (أنت). المرحلة 3، تحديد المستوى: على الكلية (إنسان، لا النظام). المرحلة 4، العرض: لكليهما (القبول، ثم أنت). المرحلة 5، القيد: لكليهما (أنت والنظام معًا). تنزل الدائرة تحت الخيط حيث يكون الفعل على المتقدّم، وترتفع فوقه حيث يكون على الكلية، وتقف على الخيط نفسه حيث تكون المرحلة لكليهما حقًّا. وهذا التناوب هو مقصود الرسم: فمن رأى أيّ المراحل ليست بيده رأى كذلك أيّها له أن يسأل عنها.</desc>
<text x="808.0" y="50.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧مسار الطلب⁩</text>
  <text x="808.0" y="78.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧خمس مراحل، ونصفها ليس بيدك.⁩</text>
