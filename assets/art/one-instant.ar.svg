  <title id="one-instant-title">لحظة واحدة، مقروءةً على خمس ساعات، وخيطٌ واحد يمرّ بها جميعًا</title>
  <desc id="one-instant-desc">خمسة أوجه ساعات في صفّ، كلٌّ منها على ساعة مختلفة، يجمعها خيط أفقي واحد. غرينتش تقرأ 12:00 بفرق +00:00؛ لندن تقرأ 13:00 بفرق +01:00؛ الرياض تقرأ 15:00 بفرق +03:00؛ كراتشي تقرأ 17:00 بفرق +05:00؛ جاكرتا تقرأ 19:00 بفرق +07:00. والخيط هو الحجّة: ليست هذه خمسة أوقات مختلفة بل لحظة واحدة، ولا تختلف الأوجه الخمسة إلا في كيفية قول كل ساعة لها. ولهذا يحمل كل وقت ينشره النظام اسم منطقته وفرقه ولحظته بتوقيت غرينتش، لا الساعة وحدها.</desc>
<text x="804.0" y="50.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧لحظة واحدة⁩</text>
  <text x="804.0" y="78.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧ليست خمسة أوقات. وقتٌ واحد، وخمس طرائق في قوله.⁩</text>
