  <title id="payment-received-title">What a payment sets in motion at the College: four stations from the charge to an open level, and the fourteen-day window that runs beneath them</title>
  <desc id="payment-received-desc">A single measured line carrying four stations. The first is the charge leaving the card at the payer’s own bank; the second is the money being received and recorded in the College’s ledger; the third is a numbered receipt being issued; the fourth is the level opening, with its work available. Beneath the line a bracket spans from the first station to the last, labelled with the fourteen days in which Executive Decision E1 returns the whole sum, no reason required, provided no assessed work in the level has been opened — the clock running from the charge rather than from the enrolment. Under the bracket are three standing conditions: a level may be paid in four equal parts at no charge for using them, nothing is ever charged for a resit or for repeating a level, and every figure is published in dollars and in the currency actually charged.</desc>
<text x="62.0" y="46.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">WHAT A PAYMENT SETS IN MOTION</text>
  <text x="62.0" y="74.0" text-anchor="start" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#F2E3C0">From the charge to a place on the programme — and the window that stays open behind it.</text>
  <path data-draw="1100" d="M86.0 176.0L812.0 176.0" stroke="#C7A24A" stroke-width="1.6" stroke-linecap="butt" fill="none"/>
