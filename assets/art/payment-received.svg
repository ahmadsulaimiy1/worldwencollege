  <text data-pop="" x="122.0" y="180.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F2E3C0" direction="ltr">1</text>
  <text data-pop="" x="122.0" y="142.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">The charge leaves</text>
  <text data-pop="" x="122.0" y="158.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8FA3C4">your card, at your bank</text>
  <g data-pop=""><circle cx="340.0" cy="176.0" r="12" fill="#0E1B33" stroke="#D4AF37" stroke-width="1.8"/><circle cx="340.0" cy="176.0" r="4.1" fill="#D4AF37"/></g>
  <text data-pop="" x="340.0" y="180.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F2E3C0" direction="ltr">2</text>
  <text data-pop="" x="340.0" y="142.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">The money is received</text>
  <text data-pop="" x="340.0" y="158.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8FA3C4">and recorded in the ledger</text>
  <g data-pop=""><circle cx="558.0" cy="176.0" r="12" fill="#0E1B33" stroke="#D4AF37" stroke-width="1.8"/><circle cx="558.0" cy="176.0" r="4.1" fill="#D4AF37"/></g>
  <text data-pop="" x="558.0" y="180.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#F2E3C0" direction="ltr">3</text>
  <text data-pop="" x="558.0" y="142.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">A receipt is issued</text>
  <text data-pop="" x="558.0" y="158.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8FA3C4">numbered, and yours to keep</text>
  <g data-pop=""><circle cx="776.0" cy="176.0" r="15" fill="#0E1B33" stroke="#1E6A4F" stroke-width="2.2"/><circle cx="776.0" cy="176.0" r="5.1" fill="#D4AF37"/></g>
  <text data-pop="" x="776.0" y="180.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E6A4F" direction="ltr">4</text>
  <text data-pop="" x="776.0" y="142.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">The level opens</text>
  <text data-pop="" x="776.0" y="158.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8FA3C4">and the work is there</text>
  <path data-draw="1700" d="M122.0 238.0L122.0 268.0L776.0 268.0L776.0 238.0" stroke="#27508F" stroke-width="1.3" stroke-linecap="butt" fill="none"/>
  <text data-pop="" x="450.0" y="292.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F2E3C0">14 days, and the work not opened</text>
  <text data-pop="" x="450.0" y="310.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#6E93C4">Refunded in full, no reason required</text>
