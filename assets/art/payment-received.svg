  <text data-pop="" x="92.0" y="356.0" text-anchor="start" font-family="Inter, sans-serif" font-size="11" fill="#E7C97A">A level may be paid in 4 equal parts, at no charge for using them</text>
  <circle data-pop="" cx="78.0" cy="374.0" r="3" fill="#D4AF37"/>
  <text data-pop="" x="92.0" y="378.0" text-anchor="start" font-family="Inter, sans-serif" font-size="11" fill="#E7C97A">A resit is never charged for, and neither is repeating a level</text>
  <circle data-pop="" cx="78.0" cy="396.0" r="3" fill="#D4AF37"/>
  <text data-pop="" x="92.0" y="400.0" text-anchor="start" font-family="Inter, sans-serif" font-size="11" fill="#E7C97A">Every figure is shown in dollars and in the currency you were charged in</text>
  <path d="M62.0 418.0L838.0 418.0" stroke="#4A6491" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>
  <text x="450.0" y="442.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#8FA3C4">The receipt, the enrolment and the refund window are three separate records. Your statement of account shows all three, and a query</text>
<text x="450.0" y="457.8" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#8FA3C4">about any of them is answered in writing by the Registry.</text>
