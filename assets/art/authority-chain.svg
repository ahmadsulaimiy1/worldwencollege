  <title id="authority-chain-title">The chain of academic authority, and where it is broken</title>
  <desc id="authority-chain-desc">A decision is taken and recorded under one of the two academic bodies, BASCE or the Academic Senate. There the chain stops: neither body has any members appointed, so nothing can be approved. The route that does carry decisions today runs downward instead — adopted as interim under authority delegated to the Press — and loops back to approval, because an interim decision awaits ratification rather than being finished. Four posts are unfilled, and each blocks something specific: with no External Examiner no award can be conferred; with no board members nothing can be approved; with no Academic Reviewer no volume is read independently of its author; with no principal officer no institutional message can be signed.</desc>
