  <title id="quality-cycle-title">حلقتا جودة بسرعتين مختلفتين — وإحداهما لم تدر قط</title>
  <desc id="quality-cycle-desc">حلقتان متحدتا المركز. الحلقة الداخلية مغلقة وتدور: أربعة فحوص آلية — بنية المنهج، وسياسة معايير التصحيح، والادعاءات المنشورة، والمصطلحات المسحوبة — تعمل على السجل مع كل تعديل في المستودع، بالثواني. أما الحلقة الخارجية فهي السنة الأكاديمية بست محطات: تصميم المنهج، والنشر قبل التدريس، وتدريس دفعة، والتقييم والتصحيح، والمراجعة في ضوء الأدلة، وتنقيح الإطار. المحطتان الأوليان مكتملتان ومرسومتان متصلتين. والمحطات الأربع الباقية مرسومة قوسًا مفتوحًا، لأن للكلية 0 تسجيلًا، ودرّست 0 حصة، ومنحت 0 شهادة، فلم تدر الحلقة دورة واحدة. والفجوة بين الحلقتين هي المقصد: ثمة شيء حقيقي يُفحص باستمرار، والدورة التي تُصادق على ذلك الفحص لا يمكن أن تبدأ قبل أن يُدرَّس أحد.</desc>
