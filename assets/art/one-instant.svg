     aria-labelledby="one-instant-title one-instant-desc">
  <title id="one-instant-title">One moment, read on five clocks, with a single thread through all of them</title>
  <desc id="one-instant-desc">Five clock faces in a row, each set to a different hour, joined by one horizontal thread. UTC reads 12:00 at offset +00:00; London reads 13:00 at offset +01:00; Riyadh reads 15:00 at offset +03:00; Karachi reads 17:00 at offset +05:00; Jakarta reads 19:00 at offset +07:00. The thread is the argument: these are not five different times but one instant, and the five faces differ only in how each clock says it. That is why every time the platform publishes carries its zone name, its offset and its UTC instant rather than an hour alone.</desc>
<text x="96.0" y="50.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">ONE INSTANT</text>
  <text x="96.0" y="78.0" text-anchor="start" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#F2E3C0">Not five times. One time, and five ways of saying it.</text>
