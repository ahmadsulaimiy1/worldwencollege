  <title id="the-three-rungs-title">مراحل التظلّم الثلاث، مرسومةً سلَّمًا يصعد مبتعدًا عن القرار المتظلَّم منه</title>
  <desc id="the-three-rungs-desc">سلَّمٌ من ثلاث درجاتٍ يرتفع مبتعدًا عن كتلةٍ واحدةٍ في أسفله هي القرار المتظلَّم منه. الدرجة الأولى يسمعها عضو هيئةٍ أكاديميّةٍ أعلى من صاحب ذلك القرار وغيرُه، ويُجاب عنها في عشرة أيّام عمل. والثانية يسمعها مجلس الشيوخ الأكاديمي، وهو يضع المعايير ولا يصحّح عملًا، في عشرين يومًا. والثالثة يسمعها حاكم، ولا يجلس في المجلس أحدٌ من التنفيذيّين؛ ولا تنشر الكلّية مدّةً لها وتُلزم نفسها بعشرين يوم عملٍ بدلًا من ذلك، وقد وُسم ذلك في اللوحة إلزامًا ذاتيًّا لا نشرًا. وكلُّ درجةٍ أبعدُ عن القرار الأصلي ممّا تحتها، وتلك هي القاعدة التي بُني عليها الإجراء كلُّه، مرسومةً مسافةً.</desc>
<text x="838.0" y="46.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧الدرجات الثلاث⁩</text>
  <text x="838.0" y="74.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧في كلّ مرحلةٍ ينتقل القرار إلى مَن لم يكن طرفًا في سابقتها.⁩</text>
