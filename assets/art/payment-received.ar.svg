  <text data-pop="" x="450.0" y="310.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="10.5" fill="#6E93C4">⁧يُردُّ المبلغ كاملًا، ولا يُطلب سبب⁩</text>
  <circle data-pop="" cx="822.0" cy="352.0" r="3" fill="#D4AF37"/>
  <text data-pop="" x="808.0" y="356.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="11" fill="#E7C97A">⁧ويجوز سداد المستوى على 4 أقساط متساوية، بلا رسمٍ على استعمالها⁩</text>
  <circle data-pop="" cx="822.0" cy="374.0" r="3" fill="#D4AF37"/>
  <text data-pop="" x="808.0" y="378.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="11" fill="#E7C97A">⁧ولا يُتقاضى شيءٌ على إعادةٍ ولا على إعادة مستوى⁩</text>
  <circle data-pop="" cx="822.0" cy="396.0" r="3" fill="#D4AF37"/>
  <text data-pop="" x="808.0" y="400.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="11" fill="#E7C97A">⁧وكلُّ رقمٍ يُعرض بالدولار وبالعملة التي خُصمت منك⁩</text>
  <path d="M62.0 418.0L838.0 418.0" stroke="#4A6491" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>
  <text x="450.0" y="442.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="10.5" fill="#8FA3C4">⁧الإيصال والقيد والنافذة ثلاثة سجلّاتٍ متمايزة. وكشفُ حسابك يعرضها جميعًا، وأيُّ استفسارٍ عن واحدٍ منها يُجاب كتابةً من مكتب المسجّل.⁩</text>
