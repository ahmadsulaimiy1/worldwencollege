  <text data-pop="" x="778.0" y="142.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">⁧يُخصم المبلغ⁩</text>
  <text data-pop="" x="778.0" y="158.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="10" fill="#8FA3C4">⁧من بطاقتك، في مصرفك⁩</text>
  <g data-pop=""><circle cx="560.0" cy="176.0" r="12" fill="#0E1B33" stroke="#D4AF37" stroke-width="1.8"/><circle cx="560.0" cy="176.0" r="4.1" fill="#D4AF37"/></g>
  <text data-pop="" x="560.0" y="180.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11" font-weight="700" fill="#F2E3C0" direction="ltr">2</text>
  <text data-pop="" x="560.0" y="142.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">⁧يُستلَم المال⁩</text>
  <text data-pop="" x="560.0" y="158.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="10" fill="#8FA3C4">⁧ويُقيَّد في السجل⁩</text>
  <g data-pop=""><circle cx="342.0" cy="176.0" r="12" fill="#0E1B33" stroke="#D4AF37" stroke-width="1.8"/><circle cx="342.0" cy="176.0" r="4.1" fill="#D4AF37"/></g>
  <text data-pop="" x="342.0" y="180.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11" font-weight="700" fill="#F2E3C0" direction="ltr">3</text>
  <text data-pop="" x="342.0" y="142.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">⁧يُصدَر الإيصال⁩</text>
  <text data-pop="" x="342.0" y="158.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="10" fill="#8FA3C4">⁧مرقَّمًا، وهو لك⁩</text>
  <g data-pop=""><circle cx="124.0" cy="176.0" r="15" fill="#0E1B33" stroke="#1E6A4F" stroke-width="2.2"/><circle cx="124.0" cy="176.0" r="5.1" fill="#D4AF37"/></g>
  <text data-pop="" x="124.0" y="180.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11" font-weight="700" fill="#1E6A4F" direction="ltr">4</text>
  <text data-pop="" x="124.0" y="142.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11.5" font-weight="700" fill="#F2E3C0">⁧يُفتح المستوى⁩</text>
  <text data-pop="" x="124.0" y="158.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="10" fill="#8FA3C4">⁧وعمله حاضرٌ فيه⁩</text>
