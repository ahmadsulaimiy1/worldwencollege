  <title id="payment-received-title">ما تُحرِّكه الدفعة في الكلّية: أربع محطّاتٍ من الخصم إلى مستوًى مفتوح، والأربعة عشر يومًا الجارية تحتها</title>
  <desc id="payment-received-desc">خطٌّ مقيسٌ واحد عليه أربع محطّات. الأولى خصمُ المبلغ من البطاقة في مصرف الدافع، والثانية استلامُ المال وقيدُه في سجلّ الكلّية، والثالثة إصدارُ إيصالٍ مرقَّم، والرابعة فتحُ المستوى وإتاحةُ عمله. وتحت الخطّ قوسٌ يمتدّ من المحطّة الأولى إلى الأخيرة، مكتوبٌ عليه الأربعة عشر يومًا التي يردُّ فيها القرارُ التنفيذيُّ الأوّل المبلغَ كاملًا بلا سببٍ يُطلب، ما دام لم يُفتح عملٌ مُقيَّمٌ في المستوى — والمدّة تجري من الخصم لا من القيد. وتحت القوس ثلاثة شروطٍ قائمة: يجوز سداد المستوى على أربعة أقساطٍ متساوية بلا رسمٍ على استعمالها، ولا يُتقاضى شيءٌ على إعادةٍ ولا على إعادة مستوى، وكلُّ رقمٍ يُنشر بالدولار وبالعملة التي خُصمت فعلًا.</desc>
<text x="838.0" y="46.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧ما تُحرِّكه الدفعة⁩</text>
  <text x="838.0" y="74.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧من خصم البطاقة إلى مقعدٍ في البرنامج — والنافذة التي تبقى مفتوحةً وراءها.⁩</text>
  <path data-draw="1100" d="M814.0 176.0L88.0 176.0" stroke="#C7A24A" stroke-width="1.6" stroke-linecap="butt" fill="none"/>
  <g data-pop=""><circle cx="778.0" cy="176.0" r="12" fill="#0E1B33" stroke="#D4AF37" stroke-width="1.8"/><circle cx="778.0" cy="176.0" r="4.1" fill="#D4AF37"/></g>
