  <text data-pop="" x="250.0" y="160.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#8FA3C4" opacity="0.9">a person teaches you</text>
  <text data-pop="" x="650.0" y="136.0" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="15" font-weight="700" letter-spacing="2.2" fill="#F2E3C0">INDEPENDENT</text>
  <text data-pop="" x="650.0" y="160.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#8FA3C4" opacity="0.9">nobody teaches you</text>
