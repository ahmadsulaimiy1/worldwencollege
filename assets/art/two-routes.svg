  <title id="two-routes-title">Two routes to the same award, and where each one pays for conferral</title>
  <desc id="two-routes-desc">Two columns of fees running down into one seal. The left column is the enrolled route: a single undivided block of $3,166.67 per level, with conferral inside it, which is why an enrolled student meets no graduation fee. Across the six levels that is $19,000, and it buys teaching — a person teaches you. The right column is the independent route, drawn in three separately bought pieces: access to the level at $150, the level examination at $250, the award and its record at $200. They total $600 a level and $3,600 across the six, and they buy no teaching at all. The two columns run down into a single seal at the bottom, because the examination, the award and the entry in the register are the same on both routes. Everything that differs between them is above the seal. Nothing that differs is below it. The two columns are drawn at the same height because they show what each fee is made of rather than how large it is.</desc>
  <text x="92.0" y="52.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">TWO ROUTES, ONE AWARD</text>
  <text x="92.0" y="80.0" text-anchor="start" font-family="Inter, sans-serif" font-size="14" fill="#8FA3C4">What separates the prices is not the credential. It is whether a person teaches you.</text>
