  <title id="how-a-balance-is-struck-title">The four terms a balance is made of, drawn as one bar reduced and restored</title>
  <desc id="how-a-balance-is-struck-desc">A single bar representing everything assessed against an account. Two segments are cut from it: relief, which is a scholarship or a code once it has actually reduced a charge, and payments received. What is left standing at the right of the bar is the outstanding balance. Beyond the bar, separated from it by a plus sign, a smaller block is appended for anything refunded — drawn outside rather than inside because it is the one term that adds rather than subtracts. Underneath, the identity is written out: outstanding equals assessed minus relief minus paid plus refunded. The proportions in the drawing are illustrative and describe no particular account; the reader’s own figures are rendered below it on the page.</desc>
<text x="92.0" y="50.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">HOW A BALANCE IS STRUCK</text>
  <text x="92.0" y="78.0" text-anchor="start" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#F2E3C0">Four terms, and the College publishes every one of them.</text>
