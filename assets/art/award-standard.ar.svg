  <title id="award-standard-title">معيار الشهادات</title>
  <desc id="award-standard-desc">أربع مراتب محتسبة، لكل منها درجة إجمالية وحدّ أدنى لا تنزل تحته أي مهارة منفردة. النجاح 70 بالمئة إجمالًا ولا مهارة دون 60. والامتياز 80 ولا مهارة دون 70. والتميّز 88 ولا مهارة دون 80. والتميّز العالي 94 ولا مهارة دون 88. والمسافة بين الحدّ الأدنى والدرجة الإجمالية هي مدى ما تستطيع مهارة قوية أن تحمله عن مهارة ضعيفة، وهي تضيق كلما ارتفعت المرتبة. وثمة مرتبة خامسة، تميّز الكلية، خارج المقياس لأنها تُمنح بقرار ولا تُحتسب. ولم تُمنح أي مرتبة لأحد حتى الآن.</desc>
