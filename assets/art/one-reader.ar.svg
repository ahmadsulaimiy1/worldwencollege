  <title id="one-reader-title">كيف يبلغ الإعلان قارئًا واحدًا: ثلاثة أبوابٍ للجمهور، ونافذةُ نشرٍ واحدة، وقارئٌ واحد</title>
  <desc id="one-reader-desc">ثلاثة عقودٍ قائمةٌ على اليمين بثلاثة عروض. أوسعها يأذن لإعلانٍ موجَّهٍ إلى الكلّية كلّها فيبلغ كلَّ متعلّمٍ مسجَّل. وأوسطها يأذن لإعلانٍ إلى مستوًى واحدٍ فيبلغ المسجَّلين فيه. وأضيقها بعرض إنسانٍ واحدٍ ويأذن لإعلانٍ موجَّهٍ إلى متعلّمٍ مسمًّى. وكلُّ طريقٍ من الثلاثة يمرّ بنافذةٍ واحدةٍ موسومةٍ بأنّه منشورٌ وقد فُتح ولم يُغلَق، وهي ساعة النشر. وخلف النافذة قارئٌ واحد. وليس في الرسم طريقٌ يبلغ القارئ ثمّ يُردّ، لأنّ الباب والنافذة عبارةٌ واحدةٌ في قاعدة البيانات لا مِصفاةٌ تُطبَّق بعد جلب الإعلانات.</desc>
<text x="838.0" y="46.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧كيف يبلغ الإعلان قارئًا واحدًا⁩</text>
  <text x="838.0" y="74.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧ثلاثة أبوابٍ ونافذةٌ واحدة. والإعلان الذي لا يحقّ لك لا يُقرأ أصلًا.⁩</text>
