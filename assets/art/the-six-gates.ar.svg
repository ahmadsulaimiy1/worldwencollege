  <title id="the-six-gates-title">الشروط الستة اللازمة لشهادة المستوى، مرسومةً رواقًا ومعلَّمًا كلٌّ منها بصاحبه</title>
  <desc id="the-six-gates-desc">ستة أعمدة تحمل ساكفًا واحدًا، لأن كل شرط من شروط شهادة المستوى لازم ولا يقوم البناء إلا بالستة جميعًا. العمود الأول — إكمال الوحدات العشر — مرسوم بلون المتعلم، لأنه يتحقّق بعمله. وأما الخمسة الباقية فبلون الكلية: درجة الامتحان الإجمالية، وحدّ المعيار، وحدّ المهارة، والورقة الشفوية، وتأكيد إنسانٍ أن المستوى قد تمّ. وكلٌّ من هذه سجلٌّ تصنعه الكلية لا عملٌ يعمله المتعلم، ولذلك تعدّه صفحةُ المتعلم على الكلية.</desc>
<text x="826.0" y="48.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧الشروط الستة⁩</text>
  <text x="826.0" y="76.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧كلُّها لازم. والتصنيف لا يعلو على شرط.⁩</text>
