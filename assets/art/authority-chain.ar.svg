  <title id="authority-chain-title">سلسلة الصلاحية الأكاديمية، وموضع انقطاعها</title>
  <desc id="authority-chain-desc">يُتَّخذ القرار ويُسجَّل تحت إحدى الهيئتين الأكاديميتين: مجلس المعايير والتميّز المنهجي أو المجلس الأكاديمي. وعند هذا الحد تتوقف السلسلة: لم يُعيَّن أي عضو في أي من الهيئتين، فلا يمكن اعتماد شيء. أما الطريق الذي يحمل القرارات فعلًا اليوم فينزل جانبًا — اعتماد مؤقت بتفويض إلى المطبعة — ثم يعود صاعدًا إلى الاعتماد، لأن القرار المؤقت ينتظر التصديق ولا يُعدّ منتهيًا. وأربعة مناصب شاغرة، كل منها يعطّل أمرًا بعينه: بلا ممتحن خارجي لا تُمنح شهادة؛ وبلا أعضاء للهيئتين لا يُعتمد شيء؛ وبلا مراجع أكاديمي لا يُقرأ أي مجلّد قراءة مستقلة عن مؤلفه؛ وبلا مسؤول تنفيذي لا تُوقَّع أي رسالة مؤسسية.</desc>
