  <title id="authority-chain-title">سلسلة الصلاحية الأكاديمية، وموضعا توقفها</title>
  <desc id="authority-chain-desc">يُتَّخذ القرار فينتقل إلى إحدى الهيئتين الأكاديميتين، ولا يبلغ أي من الطريقين الاعتماد — غير أنهما يتوقفان لسببين مختلفين، وهذا هو مقصد الرسم. فمجلس المعايير الأكاديمية والتميّز المنهجي بلا أعضاء معيَّنين، فطريقه مقطوع: الهيئة التي لا أحد فيها لا تعتمد شيئًا. أما المجلس الأكاديمي فله 3 أعضاء معيَّنون، فطريقه سليم — ومرسوم مغلقًا ببوابة لا مقطوعًا، لأن المجلس شُكِّل ولم ينعقد بعد. والهيئة التي تستطيع الاعتماد ولم تجتمع لم تعتمد شيئًا. أما الطريق الذي يحمل القرارات فعلًا اليوم فيمرّ تحتهما — اعتماد مؤقت بتفويض إلى المطبعة — ثم يعود صاعدًا إلى الاعتماد، لأن القرار المؤقت ينتظر التصديق ولا يُعدّ منتهيًا. وأربعة أمور لا تزال ناقصة، كل منها يعطّل أمرًا بعينه: بلا ممتحن خارجي لا تُمنح شهادة؛ وبلا أعضاء لمجلس المعايير لا يُعتمد أي ربط بالكفايات؛ وإلى أن ينعقد المجلس الأكاديمي لا يُعتمد أي ربط بالمهارات؛ وبلا مراجع أكاديمي لا يُقرأ أي مجلّد قراءة مستقلة عن مؤلفه.</desc>
  <g data-pop=""><rect x="718.0" y="123.0" width="140.0" height="62.0" rx="3" fill="rgba(31,61,122,0.30)" stroke="#D4AF37" stroke-width="1.4" stroke-opacity="1"/></g>
