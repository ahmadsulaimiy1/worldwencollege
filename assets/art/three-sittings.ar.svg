  <title id="three-sittings-title">الجلسات الثلاث المتاحة للمتعلّم، والأربعة عشر يومًا بينها، وما تصنعه اللائحة بعد الثالثة</title>
  <desc id="three-sittings-desc">خطٌّ مقيسٌ واحد عليه ثلاث علامات: جلسةٌ أولى وإعادتان. والمسافة المرسومة بين كلّ اثنتين هي الأربعة عشر يومًا التي تشترطها اللائحة بين الجلستين، مسمّاةً لا زخرفًا. وبعد العلامة الثالثة لا يقف الخطُّ عند جدار، بل يمرّ تحت عقدٍ هو نصُّ اللائحة نفسها: يُعاد المستوى ويُوضع التقييم من جديد لا يُجلَس له رابعةً. وتحت الخطّ الشروطُ الثلاثة القائمة في كلّ جلسة: الدرجة المكتسَبة في إعادةٍ تُحتسَب إلى سبعين، ولا يُتقاضى شيءٌ على إعادةٍ ولا على إعادة مستوى، والمهمّة التي مضى على أوّل جلوسٍ لها أكثر من سنةٍ تُوضع من جديد لا تُعاد.</desc>
<text x="838.0" y="46.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧ثلاث جلسات⁩</text>
