  <title id="provenance-columns-title">Four kinds of teaching knowledge, and the one that is empty</title>
  <desc id="provenance-columns-desc">The support record behind the Teacher's Companion holds 530 entries across seventeen fields, and every entry declares where its knowledge came from. They are drawn as four columns. Derived, read off the curriculum itself, holds 359 entries. Established, attested in the international teaching of English, holds 19. Designed, an authored judgement by the people who wrote the programme, holds 152. A rule separates those three from the fourth, because the difference is one of kind and not of quantity: the first three were produced by writing, and the fourth cannot be. Observed — what actually happened in a room with real learners, written down by whoever it happened to — is drawn as a dashed outline at the full height of the plot with nothing inside it. It holds nought entries. Three cohorts have been taught and none of it was recorded under this scheme, so the column is left empty rather than filled with the other three kinds.</desc>
