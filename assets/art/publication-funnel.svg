  <title id="publication-funnel-title">From the register to the shelf, and the gate at the end of it</title>
  <desc id="publication-funnel-desc">A funnel in three stages. The register behind WEC Press holds seventy-four candidate resources. Eleven volumes have been produced for readers, composed, typeset and proofed, with two further volumes produced for internal use. The narrowing between seventy-four and eleven is deliberate: the Press publishes under a standing rule never to publish in order to raise the count, and two planned titles have been formally withdrawn under that rule with the withdrawal recorded rather than forgotten. The third stage is nought. No Academic Reviewer has been appointed, so no volume has been read independently of the people who wrote it, and the gate to that stage is drawn shut.</desc>
