  <title id="one-cell-title">خليّةٌ من شبكة المشاركة مفكوكةً إلى دليلٍ وقراءةٍ للمنصّة وتصحيحٍ مكتوبٍ فوقها</title>
  <desc id="one-cell-desc">ثلاث طبقاتٍ لجسمٍ واحد لا ثلاثة صناديق متفرّقة. في القاعدة الدليل الذي أنتجه الخادم: زمن دراسةٍ قاسه، وتقييمٌ حُووِل، وحصّةٌ حيّةٌ أكّدها مضيفها، ودرسٌ أُكمِل، وتدريبُ معملٍ سُلِّم — ويحمل كلٌّ منها البند الذي يُحتسَب تحته. وفوقه الحال التي استنبطتها المنصّة من ذلك الدليل، وهي ما تعرضه الخليّة ما لم يمسّها أحد. وفي الأعلى حالٌ كتبها عضو هيئة، مرسومةً غائرةً شبهَ شفّافة لتبقى القراءةُ تحتها مقروءةً من خلالها. وتلك حجّة الرسم وقاعدة الوحدة البرمجية: التصحيح لا يخفي ما صحّحه، وتبقى القراءتان في السجلّ ومعهما سبب التغيير. والخليّة كلُّها تقيس نافذةً واحدةً من سبعة أيّام، مربوطةً ببدء المتعلّم نفسه لا بأسبوع التقويم.</desc>
<text x="838.0" y="46.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧خليّةٌ واحدة، مفكوكة⁩</text>
  <text x="838.0" y="74.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧دليلٌ، وقراءةٌ له، وتصحيحٌ يُبقي القراءة ظاهرة.⁩</text>
