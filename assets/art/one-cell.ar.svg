  <text x="450.0" y="436.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="11" fill="#E7C97A">⁧والتصحيح لا يخفي ما صحّحه. تبقى القراءتان في السجلّ، ويُسجَّل معهما السبب.⁩</text>
