  <title id="provenance-columns-title">أربعة أنواع من المعرفة التدريسية، وواحد منها فارغ</title>
  <desc id="provenance-columns-desc">يضم سجل الإسناد الذي يقوم عليه دليل المعلم 530 مدخلة في سبعة عشر حقلًا، وكل مدخلة تعلن من أين جاءت معرفتها. وهي مرسومة في أربعة أعمدة. المشتق، المقروء من المنهج نفسه، فيه 359 مدخلة. والمُثبَت، المشهود له في التدريس الدولي للإنجليزية، فيه 19. والمصمَّم، وهو حكم مؤلَّف من كتبوا البرنامج، فيه 152. ويفصل خطٌّ هذه الثلاثة عن الرابع، لأن الفرق فرق نوع لا فرق مقدار: فالثلاثة الأولى أنتجتها الكتابة، والرابع لا تنتجه. والمُشاهَد — ما جرى فعلًا في غرفة فيها متعلمون، يكتبه من وقع له — مرسوم إطارًا متقطعًا بكامل ارتفاع اللوحة وليس فيه شيء. فيه صفر مدخلة. دُرِّست ثلاث دفعات ولم يُدوَّن منها شيء وفق هذا النظام، فتُرك العمود فارغًا ولم يُملأ بالأنواع الثلاثة الأخرى.</desc>
  <text x="808.0" y="52.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧سجل الإسناد التعليمي⁩</text>
  <text x="808.0" y="78.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="13" fill="#8FA3C4">⁧530 مدخلة في 17 حقلًا، كل مدخلة موسومة بمصدر معرفتها⁩</text>
