  <title id="quality-cycle-title">Two quality loops, running at different speeds — and one of them has never turned</title>
  <desc id="quality-cycle-desc">Two concentric rings. The inner ring is closed and turning: four automated checks — curriculum structure, rubric policy, published claims and retired terminology — run against the record on every change to the repository, in seconds. The outer ring is the academic year, in six stations: design the curriculum, publish before teaching, teach a cohort, assess and mark, review against the evidence, revise the framework. The first two are complete and drawn solid. The remaining four are drawn as an open arc, because the College has 0 enrolments, has taught 0 sessions and has conferred 0 awards, so the ring has never come round even once. The gap between the two rings is the point: something real is being checked continuously, and the cycle that would validate the checking cannot begin until somebody is taught.</desc>
