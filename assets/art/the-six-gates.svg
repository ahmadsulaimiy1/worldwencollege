  <title id="the-six-gates-title">The six necessary conditions of a level award, drawn as a colonnade and marked by whose each one is</title>
  <desc id="the-six-gates-desc">Six columns carrying one entablature, because every condition of a level award is necessary and the structure does not stand without all six. The first column — ten modules completed — is drawn in the learner’s own colour, because it is met by their work. The other five are drawn in the College’s: the examination overall mark, the criterion floor, the skill floor, the spoken paper, and a person confirming the level is finished. Each of those is a record the College makes rather than work the learner does, and the learner’s own page marks them as the College’s for that reason.</desc>
<text x="74.0" y="48.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">THE SIX GATES</text>
  <text x="74.0" y="76.0" text-anchor="start" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#F2E3C0">Every one of them is necessary. A classification never overrides a gate.</text>
