  <title id="how-a-balance-is-struck-title">الحدود الأربعة التي يتركّب منها الرصيد، مرسومةً شريطًا يُنقَص ثم يُردّ إليه</title>
  <desc id="how-a-balance-is-struck-desc">شريط واحد يمثّل كل ما قُدِّر على حساب. يُقتطع منه جزآن: الإعفاء، وهو منحة أو رمز بعد أن يكون قد خفّض مبلغًا فعلًا، والدفعات المستلمة. ثم يُضاف جزء أصغر لما استُرِدّ. وما يبقى قائمًا في الطرف هو الرصيد. وتحت ذلك تُكتب المعادلة: الرصيد يساوي المقدَّر ناقصًا الإعفاء ناقصًا المسدَّد زائدًا المستردّ. والنسب في الرسم للإيضاح ولا تصف حسابًا بعينه؛ وأرقام القارئ نفسه تُعرض أسفل منه في الصفحة.</desc>
<text x="808.0" y="50.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#6E93C4">⁧كيف يُضرب الرصيد⁩</text>
  <text x="808.0" y="78.0" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="15" fill="#F2E3C0">⁧أربعة حدود، والكلية تنشرها كلَّها.⁩</text>
