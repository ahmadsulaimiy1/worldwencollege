  <text x="450.0" y="402.0" text-anchor="middle" font-family="Cairo, Inter, sans-serif" font-size="10.5" fill="#4A6491">⁧النسب أعلاه للإيضاح. أما أرقامك أنت، وهل تستقيم بها المعادلة، فأدناه.⁩</text>
