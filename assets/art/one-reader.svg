  <title id="one-reader-title">How a notice reaches one reader: three gates of audience, one window of publication, one reader</title>
  <desc id="one-reader-desc">Three arches stand on the left, drawn at three widths. The widest admits a notice addressed to the whole College and reaches every enrolled learner. The middle one admits a notice to a single level and reaches those enrolled on it. The narrowest is one person wide and admits a notice addressed to one named learner. Every route from all three passes through a single window, marked published, opened, and not yet closed — the publication clock. Beyond the window is one reader. There is no route in the drawing that reaches the reader and is then turned back, because the gate and the window are one statement in the database rather than a filter applied after the notices have been fetched.</desc>
<text x="62.0" y="46.0" text-anchor="start" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#6E93C4">HOW A NOTICE FINDS ONE READER</text>
  <text x="62.0" y="74.0" text-anchor="start" font-family="'EB Garamond', Georgia, serif" font-size="15" fill="#F2E3C0">Three gates, one window. A notice you may not see is never read.</text>
