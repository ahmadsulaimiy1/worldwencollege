  <title id="award-standard-title">The award standard</title>
  <desc id="award-standard-desc">Four calculated honours, each with an overall mark and a floor beneath which no single skill may fall. Pass is 70 per cent overall with no skill below 60. Merit is 80 with no skill below 70. Distinction is 88 with no skill below 80. High Distinction is 94 with no skill below 88. The distance between the floor and the overall mark is how far a strong skill may carry a weak one, and it narrows as the bands rise: ten points at Pass, six at High Distinction. A fifth honour, Distinction of the College, sits outside the scale because it is conferred by decision and never calculated. No honour of any kind has been conferred on anyone.</desc>
