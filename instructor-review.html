<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronunciation Review | WEC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14264A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,400..600&family=Cinzel:wght@500;600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/listening-lab.css">
</head>
<body class="lab">

<header class="lab-head">
  <div class="lab-head__wrap">
    <a class="app-crest" href="/">
      <img src="/assets/images/favicon.svg" alt="" width="34" height="34" aria-hidden="true">
      <span>Worldwide English College<small>London Campus</small></span>
    </a>
    <p class="lab-eyebrow">
      <span>Instructor workspace</span>
      <span data-sep id="qCount">—</span>
      <span class="lab-offline" data-sep>offline — reviews will not send</span>
    </p>
    <h1 class="lab-title">Pronunciation review</h1>
    <p class="lab-sub">Oldest submissions first. A queue sorted newest-first starves the learners who have waited longest, so this one never is.</p>
  </div>
</header>

<main class="lab-body" id="main" style="grid-template-columns:minmax(0,1fr)">
  <div>
    <p id="qError" role="alert" style="color:var(--red);font-weight:600;margin:0 0 1rem"></p>

    <section class="lab-card">
      <div class="lab-card__head">
        <h2 class="lab-card__title">Queue</h2>
        <span class="lab-card__meta">
          <label for="levelFilter" class="sr-only">Filter by level</label>
          <select id="levelFilter" style="font:600 .8rem/1 var(--font-body);border:1px solid var(--line);border-radius:999px;padding:.4rem .6rem">
            <option value="">All levels</option>
            <option value="1">Level I</option><option value="2">Level II</option>
            <option value="3">Level III</option><option value="4">Level IV</option>
            <option value="5">Level V</option><option value="6">Level VI</option>
          </select>
        </span>
      </div>
      <div class="lab-card__body"><div id="queue"></div></div>
    </section>
  </div>
</main>

<!-- Auth chain — see the note in listening-lab.html. -->
<script src="/js/auth-config.js"></script>
<script src="/js/clerk-loader.js"></script>
<script src="/js/portal-guard.js"></script>
<script src="/js/api-auth.js"></script>
<script src="/js/portal-data.js"></script>
<script src="/js/instructor-review.js"></script>
</body>
</html>
