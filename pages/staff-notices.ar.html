<section class="section--light section-pad">
  <div class="container">
    <div class="stf-shell">

      <p class="rec-state" id="state" aria-live="polite">جارٍ تحميل اللوحة&hellip;</p>

      <section class="acc-block reveal" id="secWrite" hidden>
        <div class="desk-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-quill"/></svg> <span data-write-head></span></h2>
        </div>

        <div class="stf-act">
          <p class="stf-field__note" data-write-why></p>

          <div class="stf-field">
            <label for="nScope" data-write-scope-label></label>
            <select id="nScope" data-write-scope></select>
            <p class="stf-field__note" data-write-scope-note></p>
          </div>
          <div class="stf-field" data-write-level-field hidden>
            <label for="nLevel" data-write-level-label></label>
            <select id="nLevel" data-write-level></select>
          </div>
          <div class="stf-field">
            <label for="nTitle" data-write-title-label></label>
            <input id="nTitle" type="text" maxlength="160" dir="auto" data-write-title>
          </div>
          <div class="stf-field">
            <label for="nBody" data-write-body-label></label>
            <textarea id="nBody" dir="auto" data-write-body></textarea>
          </div>

          <div class="stf-field">
            <label for="nTitleAr" data-write-title-ar-label></label>
            <input id="nTitleAr" type="text" maxlength="160" dir="auto" data-write-title-ar>
          </div>
          <div class="stf-field">
            <label for="nBodyAr" data-write-body-ar-label></label>
            <textarea id="nBodyAr" dir="auto" data-write-body-ar></textarea>
            <p class="stf-field__note" data-write-translation-note></p>
          </div>

          <div class="stf-buttons">
            <button class="btn btn--gold aurum" type="button" data-write-publish></button>
            <button class="btn btn--outline" type="button" data-write-draft></button>
            <span class="stf-said" data-write-said aria-live="polite"></span>
          </div>
        </div>
      </section>

      <section class="acc-block reveal" id="secBoard" hidden>
        <div class="desk-head">
          <h2><svg class="icon" aria-hidden="true"><use href="#i-scroll"/></svg> <span data-board-head></span></h2>
          <div class="desk-head__tools stf-filters">
            <label for="nStatus" data-board-status-label></label>
            <select id="nStatus" data-board-status></select>
          </div>
        </div>

        <p class="stf-basis" data-board-basis></p>

        <ul class="stf-queue" data-board></ul>

        <div class="stf-clear" data-board-empty hidden>
          <span class="badge-dome badge-dome--lg" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-scroll"/></svg></span>
          <p class="stf-clear__head" data-board-empty-head></p>
          <p class="stf-clear__note" data-board-empty-note></p>
        </div>
      </section>

      <section class="acc-block reveal" id="secThreads" hidden>
        <div class="desk-head">
          <h2 id="threads"><svg class="icon" aria-hidden="true"><use href="#i-envelope"/></svg> <span data-threads-head></span></h2>
        </div>

        <p class="stf-basis" data-threads-note></p>

        <ul class="stf-queue" data-threads></ul>

        <div class="stf-clear" data-threads-empty hidden>
          <span class="badge-dome badge-dome--lg" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-envelope"/></svg></span>
          <p class="stf-clear__head" data-threads-empty-head></p>
          <p class="stf-clear__note" data-threads-empty-note></p>
        </div>
      </section>

    </div>
  </div>
</section>
