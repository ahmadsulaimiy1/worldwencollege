<!-- شريط الأدوات: أداةٌ لا شريط اتصال. انظر النسخة الإنجليزية للتعليل. -->
<div class="topbar" data-worldclock>
  <div class="topbar__inner">

    <div class="seat">
      <span class="seat__flag" aria-hidden="true">🇬🇧</span>
      <span class="seat__place">
        <span class="seat__city">لندن</span><span class="seat__country">، المملكة المتحدة</span>
      </span>
      <span class="seat__rule" aria-hidden="true"></span>
      <span class="seat__clock">
        <svg class="icon" aria-hidden="true"><use href="#i-clocktower"/></svg>
        <span data-clock-london dir="ltr">&mdash;</span>
        <span class="seat__tz">بتوقيت لندن</span>
      </span>
    </div>

    <div class="here" data-here hidden>
      <span class="here__label">تتصفّح من</span>
      <span class="here__flag" data-here-flag aria-hidden="true"></span>
      <span class="here__name" data-here-name></span>
      <span class="seat__rule" aria-hidden="true"></span>
      <span class="here__time" data-clock-local dir="ltr"></span>
    </div>

    <div class="topbar__right">
      <a href="/ar/contact/" class="topbar__item topbar__item--contact">
        <svg class="icon" aria-hidden="true"><use href="#i-envelope"/></svg>
        تواصل معنا
      </a>
      {{LANG_PICKER}}
      <div class="topbar__social" aria-label="روابط التواصل الاجتماعي">
        <a href="#" aria-label="LinkedIn"><svg class="icon" aria-hidden="true"><use href="#i-linkedin"/></svg></a>
        <a href="#" aria-label="Instagram"><svg class="icon" aria-hidden="true"><use href="#i-instagram"/></svg></a>
        <a href="#" aria-label="X / Twitter"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></a>
      </div>
    </div>
  </div>
</div>
