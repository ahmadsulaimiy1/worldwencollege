<!--
  THE ICON SPRITE.

  Injected once, immediately after <body>, on every page built by
  scripts/build.js. Referenced as:

      <svg class="icon" aria-hidden="true"><use href="#i-quill"/></svg>

  Drawn rather than sourced. Every symbol is on a 24x24 grid with a
  1.25px stroke, square terminals and mitred joins, and no fills — so
  the whole set reads as one engraving tool rather than as icons
  collected from three different libraries, which is the single most
  common way an institutional site gives itself away as a template.

  Colour comes from `currentColor` (see .icon in css/brand.css), so one
  sprite serves navy grounds, paper grounds, gold rules and burgundy
  headings without a per-context duplicate.

  Inline rather than an external sprite file on purpose: `currentColor`
  does not inherit across an external <use> reference in several
  browsers, which would defeat the whole arrangement above.

  TWO WEIGHTS, WHICH IS WHAT MAKES IT AN ENGRAVING.
  ---------------------------------------------------------------------
  A single-weight outline is what every icon library ships, and at
  institutional scale it reads as competent rather than as commissioned.
  Real engraving carries a cut line and a hairline: the structure at
  full weight, the modelling — hatching, secondary rules, interior
  detail — at roughly two-fifths of it.

  So structural paths inherit the 1.25 stroke from .icon, and detail
  paths carry `stroke-width=".55"` as a PRESENTATION ATTRIBUTE on the
  path itself. It has to be an attribute rather than a class: content
  cloned by <use> lives in a shadow tree that document CSS selectors
  cannot reach, so `.icon .hair {}` would silently do nothing. Only
  inherited properties cross that boundary, which is exactly why
  `currentColor` works above and a class would not.

  Both numbers are in the 24-unit viewBox, so the ratio between them
  holds at every rendered size — a hairline stays a hairline at 1.25rem
  and at 3.5rem.

  THE FOUR REGION MARKS are cartographic, not cultural. A set of icons
  standing for the Gulf, Europe, Africa and Asia is one careless
  decision away from four national stereotypes, so each is the same
  globe under the same graticule with a different sector engraved and a
  different locator set into it. They read as one instrument turned
  four ways, which is both the honest claim and the better drawing.
  Before this they were four copies of #i-globe on one screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false"><defs>

       way a real foil die leaves a graduated sheen rather than a solid

       icon references it, so one definition serves every symbol.
       Referenced via CSS: `.vessel__badge .icon { stroke: url(#i-foil-gold); }` -->
  <linearGradient id="i-foil-gold" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#8C6A3F"/>
    <stop offset="28%" stop-color="#F2E3C0"/>
