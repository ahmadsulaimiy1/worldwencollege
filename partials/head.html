<!-- THE BUILD STAMP.
     The commit this page was generated from, emitted on every page.
     It exists so a deployment can be PROVEN rather than assumed: the
     deploy workflow fetches the live domain after publishing and
     refuses to report success unless the stamp it finds is the commit
     it just built. Four rounds of "it deployed" / "I cannot see it"
     were spent because nothing on the served page said which build it
     was. Now every page says. -->
<meta name="wec-build" content="{{BUILD_ID}}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<!-- INDEXABLE, OR THE LEARNER'S OWN. A page that mounts
     js/portal-guard.js is a page behind a sign-in — a statement of
     account, a set of marks, a payment confirmation — and it belonged
     in neither a search index nor the sitemap. Eleven of them were in
     both. scripts/build.js decides this from the guard rather than from
     a flag somebody has to remember to set: a page that guards itself
     is private, and there is no case where it is not. -->
{{ROBOTS}}
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/images/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14264A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The display face is self-hosted and preloaded: it sets every
     heading above the fold, so it must never arrive after the text it
     shapes. The italic is not preloaded — it first appears below the
     fold and swap covers it. -->
<link rel="preload" href="/assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link href="{{FONTS_URL}}" rel="stylesheet">{{FONTS_SUBSET}}
<link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/atelier.css">
<link rel="stylesheet" href="/css/pages.css">{{EXTRA_CSS}}
<!-- LAST, and that ordering is load-bearing. Script-specific typography
     has to be able to override the general stylesheets, because those
     set tracking and leading tuned to Latin faces and Arabic inherits
     it. Putting this first — which is where it started — left 951 of
     1,049 violations standing. See the header of css/arabic.css. -->
<link rel="stylesheet" href="/css/arabic.css">
<noscript><style>
/* Several entrance effects are authored hidden and revealed by script:
   .reveal (js/site.js), .split-word and .rule-draw (js/motion.js),
   .assemble__d and .gilt (js/atelier.js). With scripting off, nothing
   ever reveals them — the page renders, passes every check, and shows
   the reader blank space where the content is. Each is pinned to its
   finished state here, which is the same contract the
   prefers-reduced-motion blocks keep. */
.reveal, .split-word, .assemble__d, .foil, .wax-seal, .constellation { opacity: 1 !important; transform: none !important; }
.rule-draw { transform: scaleX(1) !important; }
.gilt { --gilt: 1; }
.plate--drift img, .plate--drift svg { animation: none !important; }
</style></noscript>
