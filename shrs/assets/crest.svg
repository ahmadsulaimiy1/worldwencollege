<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="crest-title">
  <title id="crest-title">Sultan Hanafi Royal Schools — armorial crest</title>

  <defs>
    <!-- Five-point mullet, reused at several scales -->
    <polygon id="shrs-mullet"
      points="0,-10 2.47,-3.4 9.51,-3.09 3.99,1.3 5.88,8.09 0,4.2 -5.88,8.09 -3.99,1.3 -9.51,-3.09 -2.47,-3.4"/>

    <!-- Arc carrying the Arabic style of the school, above the shield -->
    <path id="shrs-arc" d="M 108 108 Q 200 52 292 108" fill="none"/>

    <linearGradient id="shrs-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#E3C88A"/>
      <stop offset="0.5" stop-color="#C7A560"/>
      <stop offset="1"   stop-color="#9C7C3C"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#shrs-gold)" stroke-width="2.2" stroke-linejoin="round">
    <!-- Khātim: the eight-point star is two squares, one rotated 45° -->
    <rect x="62" y="62" width="276" height="276"/>
    <rect x="62" y="62" width="276" height="276" transform="rotate(45 200 200)"/>
  </g>

  <!-- Style of the school, arched -->
  <text font-family="Amiri, 'Scheherazade New', 'Traditional Arabic', serif"
        font-size="21" fill="url(#shrs-gold)" letter-spacing="1">
    <textPath href="#shrs-arc" startOffset="50%" text-anchor="middle">مدارس السلطان حنفي الملكية</textPath>
  </text>

  <!-- Scrollwork mantling, restrained: four strokes a side, mirrored -->
  <g fill="none" stroke="url(#shrs-gold)" stroke-width="2" stroke-linecap="round">
    <path d="M134 150 C 108 140 96 156 104 172 C 110 184 126 184 132 174"/>
    <path d="M132 186 C 104 182 92 200 102 214 C 110 226 126 224 132 214"/>
    <path d="M136 224 C 114 228 108 246 120 256 C 130 264 142 258 144 248"/>
    <path d="M118 158 C 126 168 128 182 124 196"/>

    <path d="M266 150 C 292 140 304 156 296 172 C 290 184 274 184 268 174"/>
    <path d="M268 186 C 296 182 308 200 298 214 C 290 226 274 224 268 214"/>
    <path d="M264 224 C 286 228 292 246 280 256 C 270 264 258 258 256 248"/>
    <path d="M282 158 C 274 168 272 182 276 196"/>
  </g>

  <!-- Shield -->
  <path d="M138 118 L262 118 L262 205 C262 252 232 282 200 302 C168 282 138 252 138 205 Z"
        fill="#0B0C0F" stroke="url(#shrs-gold)" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- Quartering -->
  <g stroke="url(#shrs-gold)" stroke-width="1.8">
    <line x1="200" y1="118" x2="200" y2="296"/>
    <line x1="138" y1="196" x2="262" y2="196"/>
  </g>

  <g fill="url(#shrs-gold)">
    <!-- I — crescent and star: faith -->
    <path d="M166 141 A 17 17 0 1 0 166 175 A 13.6 13.6 0 1 1 166 141 Z"/>
    <use href="#shrs-mullet" transform="translate(184 152) scale(0.52)"/>

    <!-- II — open book: learning -->
    <path d="M231 163 C 224 156 216 155 210 158 L210 178 C216 175 224 176 231 182 Z"/>
    <path d="M231 163 C 238 156 246 155 252 158 L252 178 C246 175 238 176 231 182 Z"/>
    <rect x="230" y="162" width="2" height="21" rx="1"/>

    <!-- III — three mullets: the three courses of study -->
    <use href="#shrs-mullet" transform="translate(172 219) scale(0.62)"/>
    <use href="#shrs-mullet" transform="translate(156 244) scale(0.62)"/>
    <use href="#shrs-mullet" transform="translate(188 244) scale(0.62)"/>

    <!-- IV — tree: growth -->
    <rect x="226" y="238" width="5" height="24" rx="2"/>
    <path d="M228.5 244 L214 232 M228.5 248 L243 236"
          stroke="url(#shrs-gold)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle cx="228" cy="222" r="13"/>
    <circle cx="212" cy="232" r="9"/>
    <circle cx="244" cy="232" r="9"/>
  </g>

  <!-- Name -->
  <text x="200" y="338" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
        font-size="19.5" letter-spacing="2.4" fill="url(#shrs-gold)">SULTAN HANAFI</text>
  <text x="200" y="360" text-anchor="middle"
        font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
        font-size="19.5" letter-spacing="2.4" fill="url(#shrs-gold)">ROYAL SCHOOLS</text>
</svg>
