  <title id="competency-wheel-title">ست كفايات، وكم مرة يقيسها المستوى الأول فعلًا</title>
  <desc id="competency-wheel-desc">رسم شعاعي على ستة محاور، محور لكل كفاية من كفايات الكلية، يبيّن عدد تقييمات المستوى الأول المرتبطة بكل منها. الوضوح 11، التمكّن 20، التمييز 4، الاستدلال 1، الحضور 0، الامتداد 0. وثمة حلقة ذهبية مرسومة عند 2، وهي نص صلاحية مجلس المعايير نفسه: أن تُقاس كل كفاية مرات متعددة في كل مستوى. 3 من الست تتجاوز تلك الحلقة. والاستدلال داخلها، إذ تُقاس مرة واحدة. والحضور والامتداد على المركز، لا تُقاس في المستوى الأول أصلًا، فينهار المضلّع إلى المركز عند هذين المحورين. وجميع الارتباطات الـ36 مسجَّلة مؤقتة، لأن الهيئة التي تعتمدها بلا أعضاء معيَّنين. والمستويات من 2 إلى 6 بلا أي ارتباط بالكفايات بعد.</desc>
