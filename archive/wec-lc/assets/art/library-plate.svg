<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE LIBRARY — the curriculum as a body of written work.

  An engraved reading-room interior: shelving to both sides in one-point
  perspective, a rolling ladder, a reading table with an open volume,
  and an arched window at the vanishing point. Every vertical converges
  on a single station point at (400, 300), which is what makes an
  interior plate read as a room rather than as a pattern of rectangles.

  Occupies the 3:2 plate slot in chapter 03. See
  docs/photography-brief.md — PLATE 03.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Engraved illustration of a college library reading room">
  <defs>
    <radialGradient id="l-light" cx="50%" cy="46%" r="42%">
      <stop offset="0" stop-color="#F2E3C0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#F2E3C0" stop-opacity="0"/>
    </radialGradient>
    <!-- A run of book spines. Varied widths, because a shelf of
         identical spines is the tell of a drawn library. -->
    <g id="l-books">
      <path d="M0 0v46M6 0v46M9 0v46M16 0v46M20 0v46M23 0v46M31 0v46M35 0v46M41 0v46M44 0v46M52 0v46M57 0v46M60 0v46M67 0v46M72 0v46M79 0v46M83 0v46M88 0v46M95 0v46M99 0v46"/>
    </g>
  </defs>

  <g fill="none" stroke="#C7A24A" stroke-width="1.1" stroke-linecap="square" stroke-linejoin="miter">

    <!-- Light from the window. -->
    <rect x="0" y="0" width="900" height="600" fill="url(#l-light)" stroke="none"/>

    <!-- The arched window at the vanishing point. -->
    <path d="M330 214h140v210H330Z" stroke-width="1.3"/>
    <path d="M330 214a70 70 0 0 1 140 0"/>
    <path d="M400 158v266M330 268h140M330 322h140M330 376h140"/>
    <g stroke-opacity=".45">
      <path d="M365 176v248M435 176v248M330 240h140"/>
    </g>

    <!-- Left-hand shelving, converging on the station point. -->
    <g stroke-width="1.25">
      <path d="M20 96 300 214v210L20 542Z"/>
      <path d="M20 96 300 214M20 542 300 424"/>
      <path d="M20 164 300 250M20 232 300 286M20 300 300 322M20 368 300 358M20 436 300 394"/>
      <path d="M20 96v446"/>
    </g>
    <g stroke-opacity=".5" stroke-width=".85">
      <g transform="translate(30,172) scale(1.55,1.3)"><use href="#l-books"/></g>
      <g transform="translate(30,240) scale(1.45,1.25)"><use href="#l-books"/></g>
      <g transform="translate(30,308) scale(1.35,1.2)"><use href="#l-books"/></g>
      <g transform="translate(30,376) scale(1.25,1.15)"><use href="#l-books"/></g>
    </g>

    <!-- Right-hand shelving, mirrored. -->
    <g stroke-width="1.25">
      <path d="M880 96 600 214v210l280 118Z"/>
      <path d="M880 96 600 214M880 542 600 424"/>
      <path d="M880 164 600 250M880 232 600 286M880 300 600 322M880 368 600 358M880 436 600 394"/>
      <path d="M880 96v446"/>
    </g>
    <g stroke-opacity=".5" stroke-width=".85">
      <g transform="translate(620,250) scale(1.25,1.15)"><use href="#l-books"/></g>
      <g transform="translate(620,318) scale(1.35,1.2)"><use href="#l-books"/></g>
      <g transform="translate(620,386) scale(1.45,1.25)"><use href="#l-books"/></g>
    </g>

    <!-- Coffered ceiling. -->
    <g stroke-opacity=".35">
      <path d="M20 96 300 214M880 96 600 214M300 214h300"/>
      <path d="M170 96v0M300 96 372 214M600 96 528 214M450 60v154"/>
      <path d="M20 40h860M120 40 320 214M780 40 580 214"/>
    </g>

    <!-- Rolling ladder against the left stack. -->
    <g stroke-width="1.2">
      <path d="M118 190 208 470M156 178 246 458"/>
      <path d="M126 216l34-11M138 254l34-11M150 292l34-11M162 330l34-11M174 368l34-11M186 406l34-11M198 444l34-11"/>
    </g>

    <!-- Reading table, nearest the viewer: heaviest lines. -->
    <g stroke-width="1.5">
      <path d="M300 470h300l38 34H262Z"/>
      <path d="M262 504h376v10H262Z"/>
      <path d="M300 514v62M600 514v62M292 576h24M584 576h24"/>
    </g>
    <!-- An open volume on the table. -->
    <g stroke-width="1.2">
      <path d="M382 470c22-13 44-13 68 0 24-13 46-13 68 0l-8 20c-22-11-42-11-60 0-18-11-38-11-60 0Z"/>
      <path d="M450 470v20"/>
      <path d="M396 478h40M464 478h40" stroke-opacity=".5"/>
    </g>
    <!-- Reading lamp. -->
    <g stroke-width="1.2" stroke-opacity=".8">
      <path d="M556 470v-40M540 430h32l-6-18h-20Z"/>
    </g>

    <!-- Floor hatch, receding. -->
    <g stroke-opacity=".18" stroke-width=".7">
      <path d="M0 542h900M40 566h820M100 590h700"/>
    </g>
  </g>
</svg>
