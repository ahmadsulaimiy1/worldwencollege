  <title id="authority-chain-title">The chain of academic authority, and the two places it stops</title>
  <desc id="authority-chain-desc">A decision is taken and travels to one of the two academic bodies, and neither route reaches approval — but they fail in different ways, which is the point of the drawing. The Board of Academic Standards and Curriculum Excellence has 0 appointed members, so its route is severed: a body with nobody on it cannot approve anything. The Academic Senate now has 3 appointed members, so its route is intact — and is drawn closed by a gate rather than cut, because the Senate has been constituted and has not yet convened. A body that can approve but has not met has not approved anything. The route that does carry decisions today runs below both — adopted as interim under authority delegated to the Press — and loops back to approval, because an interim decision awaits ratification rather than being finished. Four things are still missing, and each blocks something specific: with no External Examiner no award can be conferred; with no BASCE members no competency mapping is approved; until the Senate convenes no skill mapping is approved; and with no Academic Reviewer no volume is read independently of its author.</desc>
