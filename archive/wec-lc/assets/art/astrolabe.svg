<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE ASTROLABE — the platform.

  The digital campus needed a plate, and a drawing of a laptop would
  have undone every other plate on the page. An astrolabe is the right
  answer for the same reason it was the right instrument: it is
  precision engineering in the service of learning, and it is the one
  piece of scientific apparatus that an audience in the Gulf reads as
  its own heritage rather than as an import.

  Mater, rete with star pointers, rule and alidade. Teal is introduced
  here only — chapter 04 is the one place on the page where technology
  is the subject, and it is the only chapter that gets the colour.

  See docs/photography-brief.md — PLATE 04.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Engraved illustration of an astrolabe">
  <defs>
    <radialGradient id="a-sheen" cx="40%" cy="34%" r="60%">
      <stop offset="0" stop-color="#F2E3C0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F2E3C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="#C7A24A" stroke-width="1.1" stroke-linecap="square">

    <circle cx="240" cy="248" r="196" fill="url(#a-sheen)" stroke="none"/>

    <!-- Throne and suspension ring. -->
    <g stroke-width="1.8">
      <circle cx="240" cy="22" r="14"/>
      <path d="M226 36h28l10 18h-48Z"/>
      <path d="M216 54h48v12h-48Z"/>
    </g>

    <!-- Mater — the limb, with its degree scale. -->
    <circle cx="240" cy="248" r="192" stroke-width="2"/>
    <circle cx="240" cy="248" r="176" stroke-width="1.5"/>
    <circle cx="240" cy="248" r="168" stroke-width=".9" stroke-opacity=".6"/>

    <!-- Degree graduations around the limb: long marks every 30, short
         every 6. Drawn as radial strokes rather than as a dashed
         circle, because a dashed circle's gaps are equal in arc length
         and these need to be equal in angle. -->
    <g stroke-opacity=".65" stroke-width=".85">
      <g>
        <path d="M240 72v16M240 424v-16M64 248h16M416 248h-16"/>
        <path d="m115.5 123.5 11.3 11.3M364.5 372.5l-11.3-11.3M115.5 372.5l11.3-11.3M364.5 123.5l-11.3 11.3"/>
      </g>
      <g stroke-width=".7" stroke-opacity=".45">
        <path d="M240 72v9" transform="rotate(15 240 248)"/><path d="M240 72v9" transform="rotate(30 240 248)"/>
        <path d="M240 72v9" transform="rotate(60 240 248)"/><path d="M240 72v9" transform="rotate(75 240 248)"/>
        <path d="M240 72v9" transform="rotate(105 240 248)"/><path d="M240 72v9" transform="rotate(120 240 248)"/>
        <path d="M240 72v9" transform="rotate(150 240 248)"/><path d="M240 72v9" transform="rotate(165 240 248)"/>
        <path d="M240 72v9" transform="rotate(195 240 248)"/><path d="M240 72v9" transform="rotate(210 240 248)"/>
        <path d="M240 72v9" transform="rotate(240 240 248)"/><path d="M240 72v9" transform="rotate(255 240 248)"/>
        <path d="M240 72v9" transform="rotate(285 240 248)"/><path d="M240 72v9" transform="rotate(300 240 248)"/>
        <path d="M240 72v9" transform="rotate(330 240 248)"/><path d="M240 72v9" transform="rotate(345 240 248)"/>
      </g>
    </g>

    <!-- The plate: tropics and horizon, in teal. This is the only
         element on the page that carries the technology colour. -->
    <g stroke="#1D5C63" stroke-opacity=".95">
      <circle cx="240" cy="248" r="146" stroke-width="1.3"/>
      <circle cx="240" cy="248" r="104" stroke-width="1.1" stroke-opacity=".75"/>
      <circle cx="240" cy="248" r="58"  stroke-width="1.1" stroke-opacity=".75"/>
      <!-- Almucantars: the offset arcs that make an astrolabe an
           astrolabe rather than a set of concentric circles. -->
      <g stroke-width=".9" stroke-opacity=".55">
        <circle cx="240" cy="286" r="120"/>
        <circle cx="240" cy="312" r="98"/>
        <circle cx="240" cy="332" r="76"/>
        <circle cx="240" cy="346" r="54"/>
      </g>
      <path d="M94 248h292M240 102v292" stroke-width=".9" stroke-opacity=".5"/>
    </g>

    <!-- Rete — the pierced star map, with pointers. -->
    <g stroke-width="1.5" stroke-opacity=".9">
      <circle cx="240" cy="248" r="150"/>
      <path d="M240 98c-42 30-64 74-64 122s22 84 64 106c42-22 64-58 64-106s-22-92-64-122Z" stroke-opacity=".55"/>
      <!-- Ecliptic ring, off-centre as it must be. -->
      <circle cx="240" cy="212" r="96" stroke-width="1.3"/>
      <circle cx="240" cy="212" r="82" stroke-width=".8" stroke-opacity=".5"/>
    </g>
    <!-- Star pointers. -->
    <g fill="#D4AF37" stroke="none">
      <path d="m178 148 2.6 5.4 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z"/>
      <path d="m316 186 2.6 5.4 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z"/>
      <path d="m296 330 2.6 5.4 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z"/>
      <path d="m160 300 2.6 5.4 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z"/>
    </g>

    <!-- Alidade and rule. -->
    <g stroke-width="1.9">
      <path d="M104 184 376 312"/>
      <path d="M100 178h18v12h-18ZM362 306h18v12h-18Z" stroke-width="1.2"/>
      <path d="M94 248h292" stroke-opacity=".7"/>
    </g>

    <!-- Central pin. -->
    <circle cx="240" cy="248" r="9" stroke-width="1.8"/>
    <circle cx="240" cy="248" r="3.4" fill="#D4AF37" stroke="none"/>
  </g>
</svg>
