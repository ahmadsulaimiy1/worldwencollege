  <title id="competency-wheel-title">Six competencies, and how often Level I actually assesses each</title>
  <desc id="competency-wheel-desc">A radar chart on six axes, one for each of the College's competencies, plotting how many Level I assessments are mapped to each. Clarity 11, Command 20, Judgement 4, Reason 1, Bearing 0, Reach 0. A gold threshold ring is drawn at 2, which is BASCE's own remit: each competency is to be assessed multiple times across each level. 3 of the six clear that ring. Reason sits inside it, assessed once. Bearing and Reach sit on the hub, not assessed at Level I at all, so the polygon collapses to the centre on those two axes. All 36 mappings are recorded as interim, because the board that would approve them has no appointed members. Levels 2 to 6 carry no competency mapping yet.</desc>
