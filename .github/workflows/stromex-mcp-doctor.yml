name: StromeX MCP — doctor check and autonomous write

# Two real, verified milestones for stromex/mcp (SEB-D 45, security.md
# §5, SEB §16.8's credential carve-out), on a free schedule with no
# hosting to pay for:
#
#   1. `doctor` proves ONE real provider credential authenticates.
#   2. `call github.variable.put` proves an actual WRITE, unattended,
#      through the real policy/audit gate (`core/registry.ts`'s
#      `invokeTool` -- the same path an MCP client's call takes, not a
#      shortcut around it). It sets a harmless repository variable to
#      the run's own timestamp, so the write is real, reversible, and
#      independently checkable in Settings -> Secrets and variables ->
#      Actions -> Variables.
#
# Requires a repository secret named STROMEX_MCP_GITHUB_TOKEN (a
# GitHub personal access token, scoped to the minimum this needs) --
# added via the GitHub web UI (Settings -> Secrets and variables ->
# Actions), never pasted into a chat or committed to this repo.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # stromex/ lives only on this branch, not on the branch this workflow
  # file itself must sit on to be schedulable (GitHub only discovers
  # workflow_dispatch/schedule triggers from the default branch). Same
  # cross-branch pattern sync-foundation.yml already uses.
  SOURCE_REF: claude/stromex-enterprise-mcp-z1ejxd

jobs:
  doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stromex/mcp
    steps:
      - name: Checkout the branch that actually holds stromex/
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run doctor against every provider that has a credential
        id: doctor
        env:
          GITHUB_TOKEN: ${{ secrets.STROMEX_MCP_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STROMEX_MCP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STROMEX_MCP_CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.STROMEX_MCP_NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.STROMEX_MCP_NEON_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.STROMEX_MCP_VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.STROMEX_MCP_VERCEL_TEAM_ID }}
          CLERK_SECRET_KEY: ${{ secrets.STROMEX_MCP_CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.STROMEX_MCP_RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.STROMEX_MCP_BREVO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.STROMEX_MCP_OPENAI_API_KEY }}
          # Least privilege (security.md §5): a provider only becomes
          # "configured" (config.ts activeProviders) once its own required
          # secret above is a non-empty GitHub Actions secret -- an unset
          # secret resolves to an empty string, which the resolver treats
          # as absent, so listing every provider name here is safe. Add a
          # provider's credential once, as a repo secret; nothing in this
          # file needs to change again.
          STROMEX_MCP_PROFILES: cloudflare,github,neon,vercel,clerk,resend,brevo,openai
        run: |
          set -o pipefail
          node dist/index.js doctor 2>&1 | tee doctor-output.txt

      - name: Set a real repository variable through the real gate
        id: write
        if: steps.doctor.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.STROMEX_MCP_GITHUB_TOKEN }}
          STROMEX_MCP_PROFILES: github
        run: |
          set -o pipefail
          node dist/index.js call github.variable.put \
            --args "{\"owner\":\"ahmadsulaimiy1\",\"repo\":\"worldwencollege\",\"name\":\"STROMEX_MCP_LAST_AUTONOMOUS_RUN\",\"value\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" \
            2>&1 | tee write-output.txt

      - name: Record the result (runs even if a step failed)
        if: always()
        run: |
          mkdir -p .status
          {
            echo "# StromeX MCP — last run"
            echo ""
            echo "Ran: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Doctor outcome: ${{ steps.doctor.outcome }}"
            echo "Write outcome: ${{ steps.write.outcome || 'skipped (doctor did not succeed)' }}"
            echo ""
            echo "## doctor"
            echo '```'
            cat doctor-output.txt
            echo '```'
            echo ""
            echo "## call github.variable.put"
            echo '```'
            cat write-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
          } > .status/doctor-last-run.md

      - name: Commit the status if it changed
        if: always()
        run: |
          git config user.name "stromex-mcp-doctor-bot"
          git config user.email "doctor@stromex-mcp.local"
          git add .status/doctor-last-run.md
          if git diff --cached --quiet; then
            echo "No change in doctor status."
          else
            git commit -m "StromeX MCP: doctor ${{ steps.doctor.outcome }}, write ${{ steps.write.outcome || 'skipped' }}"
            git push origin HEAD:${{ env.SOURCE_REF }}
          fi

      - name: Fail the job if the credential or the write failed
        if: steps.doctor.outcome == 'failure' || steps.write.outcome == 'failure'
        run: exit 1
