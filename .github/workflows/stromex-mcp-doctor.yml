name: StromeX MCP — doctor check and autonomous write

# Two real, verified milestones for stromex/mcp (SEB-D 45, security.md
# §5, SEB §16.8's credential carve-out), on a free schedule with no
# hosting to pay for:
#
#   1. `doctor` proves ONE real provider credential authenticates.
#   2. `call github.variable.put` proves an actual WRITE, unattended,
#      through the real policy/audit gate (`core/registry.ts`'s
#      `invokeTool` -- the same path an MCP client's call takes, not a
#      shortcut around it). It sets a harmless repository variable to
#      the run's own timestamp, so the write is real, reversible, and
#      independently checkable in Settings -> Secrets and variables ->
#      Actions -> Variables.
#
# Requires a repository secret named STROMEX_MCP_GITHUB_TOKEN (a
# GitHub personal access token, scoped to the minimum this needs) --
# added via the GitHub web UI (Settings -> Secrets and variables ->
# Actions), never pasted into a chat or committed to this repo.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # stromex/ lives only on this branch, not on the branch this workflow
  # file itself must sit on to be schedulable (GitHub only discovers
  # workflow_dispatch/schedule triggers from the default branch). Same
  # cross-branch pattern sync-foundation.yml already uses.
  SOURCE_REF: claude/stromex-enterprise-mcp-z1ejxd

jobs:
  doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stromex/mcp
    steps:
      - name: Checkout the branch that actually holds stromex/
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run doctor against every provider that has a credential
        id: doctor
        env:
          GITHUB_TOKEN: ${{ secrets.STROMEX_MCP_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STROMEX_MCP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STROMEX_MCP_CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.STROMEX_MCP_NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.STROMEX_MCP_NEON_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.STROMEX_MCP_VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.STROMEX_MCP_VERCEL_TEAM_ID }}
          CLERK_SECRET_KEY: ${{ secrets.STROMEX_MCP_CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.STROMEX_MCP_RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.STROMEX_MCP_BREVO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.STROMEX_MCP_OPENAI_API_KEY }}
          # Least privilege (security.md §5): a provider only becomes
          # "configured" (config.ts activeProviders) once its own required
          # secret above is a non-empty GitHub Actions secret -- an unset
          # secret resolves to an empty string, which the resolver treats
          # as absent, so listing every provider name here is safe. Add a
          # provider's credential once, as a repo secret; nothing in this
          # file needs to change again.
          STROMEX_MCP_PROFILES: cloudflare,github,neon,vercel,clerk,resend,brevo,openai
        run: |
          set -o pipefail
          node dist/index.js doctor 2>&1 | tee doctor-output.txt

      - name: Set a real repository variable through the real gate
        id: write
        # `always()` plus a skip-check, not `steps.doctor.outcome ==
        # 'success'`: doctor's own exit code is 1 whenever ANY configured
        # provider's live check fails, so a single known-bad credential
        # (Brevo, left unresolved by the owner's own choice) would
        # otherwise block every other provider's write too. This runs
        # whenever doctor actually executed, regardless of its overall
        # verdict -- each write step still only fires for the provider it
        # names, and only that provider's own credential has to be good.
        if: always() && steps.doctor.conclusion != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.STROMEX_MCP_GITHUB_TOKEN }}
          STROMEX_MCP_PROFILES: github
        run: |
          set -o pipefail
          node dist/index.js call github.variable.put \
            --args "{\"owner\":\"ahmadsulaimiy1\",\"repo\":\"worldwencollege\",\"name\":\"STROMEX_MCP_LAST_AUTONOMOUS_RUN\",\"value\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" \
            2>&1 | tee write-output.txt

      # Four more real writes, one per remaining provider that has a
      # credential and a genuinely inert target -- proving autonomy is
      # not a GitHub-only trick. Each creates or updates something new
      # and harmless rather than touching a real institution's live
      # data: a dedicated KV namespace, a database branch (Neon's own
      # backup mechanism, not the live data), a preview-only env var,
      # and an email to the owner's own address. Ruled 2026-09-10: every
      # [write] tool runs unattended once its credential exists -- this
      # is that ruling exercised, not just documented (SEB §16.8).
      - name: Cloudflare -- create a KV namespace and write a key through the real gate
        id: write_cloudflare
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STROMEX_MCP_CLOUDFLARE_API_TOKEN }}
          STROMEX_MCP_PROFILES: cloudflare
        run: |
          set -o pipefail
          # The CLI's own logging goes to stderr (core/logger.ts) and the
          # `call` result envelope is the only thing on stdout, so
          # redirecting stdout alone here -- not `2>&1` -- keeps the
          # captured file pure JSON to parse the new namespace's id from.
          node dist/index.js call cloudflare.kv.namespace.create \
            --args '{"title":"stromex-mcp-proof"}' \
            > ns-create-output.txt
          cat ns-create-output.txt | tee -a write-cloudflare-output.txt
          NS_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('ns-create-output.txt','utf8')).data.id)")
          node dist/index.js call cloudflare.kv.value.put \
            --args "{\"namespaceId\":\"$NS_ID\",\"key\":\"last_autonomous_run\",\"value\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" \
            2>&1 | tee -a write-cloudflare-output.txt

      - name: Neon -- create a branch through the real gate
        id: write_neon
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          NEON_API_KEY: ${{ secrets.STROMEX_MCP_NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.STROMEX_MCP_NEON_ORG_ID }}
          STROMEX_MCP_PROFILES: neon
        run: |
          set -o pipefail
          node dist/index.js call neon.branch.create \
            --args '{"projectId":"orange-dawn-28507285","name":"stromex-mcp-proof"}' \
            2>&1 | tee write-neon-output.txt

      - name: Vercel -- set a preview env var through the real gate
        id: write_vercel
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          VERCEL_TOKEN: ${{ secrets.STROMEX_MCP_VERCEL_TOKEN }}
          STROMEX_MCP_PROFILES: vercel
        run: |
          set -o pipefail
          node dist/index.js call vercel.env.set \
            --args "{\"project\":\"prj_42YG9LlfYzxjW0st9hN4h6k0ZHtv\",\"key\":\"STROMEX_MCP_LAST_AUTONOMOUS_RUN\",\"value\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"target\":[\"preview\"]}" \
            2>&1 | tee write-vercel-output.txt

      - name: Resend -- send a real email through the real gate
        id: write_resend
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          RESEND_API_KEY: ${{ secrets.STROMEX_MCP_RESEND_API_KEY }}
          STROMEX_MCP_PROFILES: resend
        run: |
          set -o pipefail
          node dist/index.js call resend.email.send \
            --args "{\"from\":\"stromex-mcp@mail.worldwencollege.co.uk\",\"to\":[\"ahmadbinibrohim@gmail.com\"],\"subject\":\"StromeX MCP -- autonomous write proof\",\"text\":\"This email was sent unattended by stromex-mcp's resend.email.send tool, through the real policy and audit gate, at $(date -u +'%Y-%m-%dT%H:%M:%SZ').\"}" \
            2>&1 | tee write-resend-output.txt

      - name: Record the result (runs even if a step failed)
        if: always()
        run: |
          mkdir -p .status
          {
            echo "# StromeX MCP — last run"
            echo ""
            echo "Ran: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Doctor outcome: ${{ steps.doctor.outcome }}"
            echo "GitHub write outcome: ${{ steps.write.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Cloudflare write outcome: ${{ steps.write_cloudflare.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Neon write outcome: ${{ steps.write_neon.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Vercel write outcome: ${{ steps.write_vercel.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Resend write outcome: ${{ steps.write_resend.outcome || 'skipped (doctor did not succeed)' }}"
            echo ""
            echo "## doctor"
            echo '```'
            cat doctor-output.txt
            echo '```'
            echo ""
            echo "## call github.variable.put"
            echo '```'
            cat write-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call cloudflare.kv.namespace.create / cloudflare.kv.value.put"
            echo '```'
            cat write-cloudflare-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call neon.branch.create"
            echo '```'
            cat write-neon-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call vercel.env.set"
            echo '```'
            cat write-vercel-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call resend.email.send"
            echo '```'
            cat write-resend-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
          } > .status/doctor-last-run.md

      - name: Commit the status if it changed
        if: always()
        run: |
          git config user.name "stromex-mcp-doctor-bot"
          git config user.email "doctor@stromex-mcp.local"
          git add .status/doctor-last-run.md
          if git diff --cached --quiet; then
            echo "No change in doctor status."
          else
            git commit -m "StromeX MCP: doctor ${{ steps.doctor.outcome }}, writes gh=${{ steps.write.outcome || 'skipped' }} cf=${{ steps.write_cloudflare.outcome || 'skipped' }} neon=${{ steps.write_neon.outcome || 'skipped' }} vercel=${{ steps.write_vercel.outcome || 'skipped' }} resend=${{ steps.write_resend.outcome || 'skipped' }}"
            git push origin HEAD:${{ env.SOURCE_REF }}
          fi

      - name: Fail the job if the credential or any write failed
        if: |
          steps.doctor.outcome == 'failure' ||
          steps.write.outcome == 'failure' ||
          steps.write_cloudflare.outcome == 'failure' ||
          steps.write_neon.outcome == 'failure' ||
          steps.write_vercel.outcome == 'failure' ||
          steps.write_resend.outcome == 'failure'
        run: exit 1
