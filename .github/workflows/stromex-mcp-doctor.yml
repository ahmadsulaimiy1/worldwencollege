name: StromeX MCP — doctor check and autonomous write

# Two real, verified milestones for stromex/mcp (SEB-D 45, security.md
# §5, SEB §16.8's credential carve-out), on a free schedule with no
# hosting to pay for:
#
#   1. `doctor` proves ONE real provider credential authenticates.
#   2. `call github.variable.put` proves an actual WRITE, unattended,
#      through the real policy/audit gate (`core/registry.ts`'s
#      `invokeTool` -- the same path an MCP client's call takes, not a
#      shortcut around it). It sets a harmless repository variable to
#      the run's own timestamp, so the write is real, reversible, and
#      independently checkable in Settings -> Secrets and variables ->
#      Actions -> Variables.
#
# Requires a repository secret named STROMEX_MCP_GITHUB_TOKEN (a
# GitHub personal access token, scoped to the minimum this needs) --
# added via the GitHub web UI (Settings -> Secrets and variables ->
# Actions), never pasted into a chat or committed to this repo.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # stromex/ lives only on this branch, not on the branch this workflow
  # file itself must sit on to be schedulable (GitHub only discovers
  # workflow_dispatch/schedule triggers from the default branch). Same
  # cross-branch pattern sync-foundation.yml already uses.
  SOURCE_REF: claude/stromex-enterprise-mcp-z1ejxd

jobs:
  doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stromex/mcp
    steps:
      - name: Checkout the branch that actually holds stromex/
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run doctor against every provider that has a credential
        id: doctor
        env:
          GITHUB_TOKEN: ${{ secrets.STROMEX_MCP_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STROMEX_MCP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STROMEX_MCP_CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.STROMEX_MCP_NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.STROMEX_MCP_NEON_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.STROMEX_MCP_VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.STROMEX_MCP_VERCEL_TEAM_ID }}
          CLERK_SECRET_KEY: ${{ secrets.STROMEX_MCP_CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.STROMEX_MCP_RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.STROMEX_MCP_BREVO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.STROMEX_MCP_OPENAI_API_KEY }}
          # Least privilege (security.md §5): a provider only becomes
          # "configured" (config.ts activeProviders) once its own required
          # secret above is a non-empty GitHub Actions secret -- an unset
          # secret resolves to an empty string, which the resolver treats
          # as absent, so listing every provider name here is safe. Add a
          # provider's credential once, as a repo secret; nothing in this
          # file needs to change again.
          STROMEX_MCP_PROFILES: cloudflare,github,neon,vercel,clerk,resend,brevo,openai
        run: |
          set -o pipefail
          node dist/index.js doctor 2>&1 | tee doctor-output.txt

      - name: Set a real repository variable through the real gate
        id: write
        # `always()` plus a skip-check, not `steps.doctor.outcome ==
        # 'success'`: doctor's own exit code is 1 whenever ANY configured
        # provider's live check fails, so a single known-bad credential
        # (Brevo, left unresolved by the owner's own choice) would
        # otherwise block every other provider's write too. This runs
        # whenever doctor actually executed, regardless of its overall
        # verdict -- each write step still only fires for the provider it
        # names, and only that provider's own credential has to be good.
        if: always() && steps.doctor.conclusion != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.STROMEX_MCP_GITHUB_TOKEN }}
          STROMEX_MCP_PROFILES: github
        run: |
          set -o pipefail
          node dist/index.js call github.variable.put \
            --args "{\"owner\":\"ahmadsulaimiy1\",\"repo\":\"worldwencollege\",\"name\":\"STROMEX_MCP_LAST_AUTONOMOUS_RUN\",\"value\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" \
            2>&1 | tee write-output.txt

      # Four more real writes, one per remaining provider that has a
      # credential and a genuinely inert target -- proving autonomy is
      # not a GitHub-only trick. Each creates or updates something new
      # and harmless rather than touching a real institution's live
      # data: a dedicated KV namespace, a database branch (Neon's own
      # backup mechanism, not the live data), a preview-only env var,
      # and an email to the owner's own address. Ruled 2026-09-10: every
      # [write] tool runs unattended once its credential exists -- this
      # is that ruling exercised, not just documented (SEB §16.8).
      - name: Cloudflare -- create a KV namespace and write a key through the real gate
        id: write_cloudflare
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STROMEX_MCP_CLOUDFLARE_API_TOKEN }}
          STROMEX_MCP_PROFILES: cloudflare
        run: |
          # `set +e`, not `set -o pipefail`: this script makes a call,
          # parses an id out of its result, then makes a second call --
          # and the default `bash -e {0}` GitHub Actions runs under
          # aborts the WHOLE script the instant any command exits
          # non-zero, before the `tee` that would have shown or
          # persisted the real error. That is exactly what made an
          # earlier failure here unrecoverable: the detail existed only
          # in the ephemeral runner and was never displayed or saved.
          # Every failure path below explicitly captures, displays,
          # persists, then exits -- nothing is allowed to vanish.
          set +e

          # Idempotent by lookup, not by a fixed id: a namespace TITLE
          # isn't unique to Cloudflare, so a bare create on every 6-hourly
          # run would keep minting duplicate "stromex-mcp-proof"
          # namespaces forever. List first and reuse what's there.
          LIST_OUTPUT=$(node dist/index.js call cloudflare.kv.namespace.list --args '{}')
          LIST_STATUS=$?
          echo "$LIST_OUTPUT" | tee write-cloudflare-output.txt
          if [ $LIST_STATUS -ne 0 ]; then
            exit 1
          fi

          NS_ID=$(node -e '
            const body = JSON.parse(process.argv[1]);
            const raw = body.data;
            const items = Array.isArray(raw) ? raw : Array.isArray(raw && raw.data) ? raw.data : (raw && raw.items) || [];
            const found = items.find((n) => n.title === "stromex-mcp-proof");
            console.log(found ? found.id : "");
          ' "$LIST_OUTPUT")

          if [ -z "$NS_ID" ]; then
            CREATE_OUTPUT=$(node dist/index.js call cloudflare.kv.namespace.create --args '{"title":"stromex-mcp-proof"}')
            CREATE_STATUS=$?
            { echo ""; echo "$CREATE_OUTPUT"; } | tee -a write-cloudflare-output.txt
            if [ $CREATE_STATUS -ne 0 ]; then
              exit 1
            fi
            NS_ID=$(node -e '
              const body = JSON.parse(process.argv[1]);
              console.log((body.data && body.data.id) || "");
            ' "$CREATE_OUTPUT")
          else
            { echo ""; echo "Namespace stromex-mcp-proof already exists ($NS_ID) from an earlier run; reusing it instead of creating a duplicate."; } | tee -a write-cloudflare-output.txt
          fi

          if [ -z "$NS_ID" ]; then
            echo "Could not determine a namespace id to write to." | tee -a write-cloudflare-output.txt
            exit 1
          fi

          PUT_OUTPUT=$(node dist/index.js call cloudflare.kv.value.put --args "{\"namespaceId\":\"$NS_ID\",\"key\":\"last_autonomous_run\",\"value\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}")
          PUT_STATUS=$?
          { echo ""; echo "$PUT_OUTPUT"; } | tee -a write-cloudflare-output.txt
          exit $PUT_STATUS

      - name: Neon -- create a branch through the real gate
        id: write_neon
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          NEON_API_KEY: ${{ secrets.STROMEX_MCP_NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.STROMEX_MCP_NEON_ORG_ID }}
          STROMEX_MCP_PROFILES: neon
        run: |
          # Idempotent by lookup: a fixed branch name on a recurring
          # 6-hourly schedule collided with itself on the very first
          # re-run (BRANCH_ALREADY_EXISTS) -- `neon.branch.delete` is
          # protected-tier and not autonomously usable for a
          # delete-then-recreate cycle, so the fix is to check first and
          # only create once, ever. `set +e` for the same
          # abort-before-display reason as the Cloudflare step above.
          set +e

          LIST_OUTPUT=$(node dist/index.js call neon.branch.list --args '{"projectId":"orange-dawn-28507285"}')
          LIST_STATUS=$?
          echo "$LIST_OUTPUT" | tee write-neon-output.txt
          if [ $LIST_STATUS -ne 0 ]; then
            exit 1
          fi

          EXISTING_ID=$(node -e '
            const body = JSON.parse(process.argv[1]);
            const items = (body.data && body.data.items) || [];
            const found = items.find((b) => b.name === "stromex-mcp-proof");
            console.log(found ? found.id : "");
          ' "$LIST_OUTPUT")

          if [ -n "$EXISTING_ID" ]; then
            { echo ""; echo "Branch stromex-mcp-proof already exists ($EXISTING_ID) from an earlier run -- the create-write was already proven then, and is deliberately not repeated every 6 hours to avoid BRANCH_ALREADY_EXISTS and unbounded branch accumulation."; } | tee -a write-neon-output.txt
            exit 0
          fi

          CREATE_OUTPUT=$(node dist/index.js call neon.branch.create --args '{"projectId":"orange-dawn-28507285","name":"stromex-mcp-proof"}')
          CREATE_STATUS=$?
          { echo ""; echo "$CREATE_OUTPUT"; } | tee -a write-neon-output.txt
          exit $CREATE_STATUS

      - name: Vercel -- set a preview env var through the real gate
        id: write_vercel
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          VERCEL_TOKEN: ${{ secrets.STROMEX_MCP_VERCEL_TOKEN }}
          STROMEX_MCP_PROFILES: vercel
        run: |
          set -o pipefail
          node dist/index.js call vercel.env.set \
            --args "{\"project\":\"prj_42YG9LlfYzxjW0st9hN4h6k0ZHtv\",\"key\":\"STROMEX_MCP_LAST_AUTONOMOUS_RUN\",\"value\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"target\":[\"preview\"]}" \
            2>&1 | tee write-vercel-output.txt

      - name: Resend -- send a real email through the real gate
        id: write_resend
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          RESEND_API_KEY: ${{ secrets.STROMEX_MCP_RESEND_API_KEY }}
          STROMEX_MCP_PROFILES: resend
        run: |
          set -o pipefail
          node dist/index.js call resend.email.send \
            --args "{\"from\":\"stromex-mcp@mail.worldwencollege.co.uk\",\"to\":[\"ahmadbinibrohim@gmail.com\"],\"subject\":\"StromeX MCP -- autonomous write proof\",\"text\":\"This email was sent unattended by stromex-mcp's resend.email.send tool, through the real policy and audit gate, at $(date -u +'%Y-%m-%dT%H:%M:%SZ').\"}" \
            2>&1 | tee write-resend-output.txt

      - name: Clerk -- invite a dedicated proof address and revoke it through the real gate
        id: write_clerk
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          CLERK_SECRET_KEY: ${{ secrets.STROMEX_MCP_CLERK_SECRET_KEY }}
          STROMEX_MCP_PROFILES: clerk
        run: |
          # `set +e` for the same abort-before-display reason as the
          # Cloudflare/Neon steps above: this run's own failure (create
          # rejected with INPUT_INVALID) had its real detail lost the
          # same way. A `+alias` address, not the owner's bare inbox: the
          # owner's own address is very likely already a real Clerk user
          # on this instance (from ordinary sign-in testing), and Clerk
          # refuses to invite an email that already belongs to a user --
          # a permanent conflict no retry fixes. The alias is still the
          # owner's real inbox (Gmail plus-addressing), just a distinct
          # identity to Clerk. `notify:false` so a real proof run every 6
          # hours doesn't put an actual invite email in that inbox.
          set +e
          PROOF_EMAIL="ahmadbinibrohim+stromexmcpproof@gmail.com"

          LIST_OUTPUT=$(node dist/index.js call clerk.invitation.list --args '{"status":"pending"}')
          LIST_STATUS=$?
          echo "$LIST_OUTPUT" | tee write-clerk-output.txt
          if [ $LIST_STATUS -eq 0 ]; then
            STALE_ID=$(node -e '
              const body = JSON.parse(process.argv[1]);
              const raw = body.data;
              const items = Array.isArray(raw) ? raw : Array.isArray(raw && raw.data) ? raw.data : (raw && raw.items) || [];
              const found = items.find((i) => i.email_address === process.argv[2]);
              console.log(found ? found.id : "");
            ' "$LIST_OUTPUT" "$PROOF_EMAIL")
            if [ -n "$STALE_ID" ]; then
              { echo ""; echo "Found a stale pending invitation ($STALE_ID) for $PROOF_EMAIL left over from an earlier run (e.g. one whose revoke step didn't complete); revoking it before creating a fresh one."; } | tee -a write-clerk-output.txt
              REVOKE_STALE_OUTPUT=$(node dist/index.js call clerk.invitation.revoke --args "{\"invitationId\":\"$STALE_ID\"}")
              { echo ""; echo "$REVOKE_STALE_OUTPUT"; } | tee -a write-clerk-output.txt
            fi
          fi

          CREATE_OUTPUT=$(node dist/index.js call clerk.invitation.create --args "{\"emailAddress\":\"$PROOF_EMAIL\",\"notify\":false}")
          CREATE_STATUS=$?
          { echo ""; echo "$CREATE_OUTPUT"; } | tee -a write-clerk-output.txt
          if [ $CREATE_STATUS -ne 0 ]; then
            exit 1
          fi

          INV_ID=$(node -e '
            const body = JSON.parse(process.argv[1]);
            console.log((body.data && body.data.id) || "");
          ' "$CREATE_OUTPUT")
          if [ -z "$INV_ID" ]; then
            echo "Invitation created but no id was found in the response." | tee -a write-clerk-output.txt
            exit 1
          fi

          REVOKE_OUTPUT=$(node dist/index.js call clerk.invitation.revoke --args "{\"invitationId\":\"$INV_ID\"}")
          REVOKE_STATUS=$?
          { echo ""; echo "$REVOKE_OUTPUT"; } | tee -a write-clerk-output.txt
          exit $REVOKE_STATUS

      - name: OpenAI -- run one real, priced consultation through the real gate
        id: write_openai
        if: always() && steps.doctor.conclusion != 'skipped'  # see the `write` step above
        env:
          OPENAI_API_KEY: ${{ secrets.STROMEX_MCP_OPENAI_API_KEY }}
          STROMEX_MCP_PROFILES: openai
          # SEB §26.6: a spending policy must be turned on deliberately,
          # with both limits, before any metered call is allowed to run
          # unattended -- this is the owner's own explicit choice
          # (2026-09-10: $25 single / $50 monthly), not a default this
          # file invented. Rates are installation.md's own documented,
          # sourced published rate for the default model (2026-08-18),
          # not a guessed figure -- an unpriced consultation is refused
          # outright once the policy is in force (see openai/tools.ts).
          STROMEX_SPEND_ENABLED: 'true'
          STROMEX_SPEND_CURRENCY: USD
          STROMEX_SPEND_MAX_SINGLE: '25'
          STROMEX_SPEND_MONTHLY_CAP: '50'
          OPENAI_PRICE_INPUT_PER_MTOK: '2.00'
          OPENAI_PRICE_OUTPUT_PER_MTOK: '12.00'
          OPENAI_PRICE_CURRENCY: USD
        run: |
          set -o pipefail
          # Low effort, small output cap: this proves the real, priced,
          # policy-gated write path -- it is not meant to be an expensive
          # consultation, just a genuine one.
          node dist/index.js call openai.validate.independent \
            --args '{"subject":"This GitHub Actions run proves stromex-mcp can perform a real, autonomous, policy-gated OpenAI write action, unattended, inside its configured spending cap.","question":"Does this run, by itself, constitute genuine proof of that claim, or is something still missing?","effort":"low","maxOutputTokens":256}' \
            2>&1 | tee write-openai-output.txt

      - name: Record the result (runs even if a step failed)
        if: always()
        run: |
          mkdir -p .status
          {
            echo "# StromeX MCP — last run"
            echo ""
            echo "Ran: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Doctor outcome: ${{ steps.doctor.outcome }}"
            echo "GitHub write outcome: ${{ steps.write.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Cloudflare write outcome: ${{ steps.write_cloudflare.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Neon write outcome: ${{ steps.write_neon.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Vercel write outcome: ${{ steps.write_vercel.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Resend write outcome: ${{ steps.write_resend.outcome || 'skipped (doctor did not succeed)' }}"
            echo "Clerk write outcome: ${{ steps.write_clerk.outcome || 'skipped (doctor did not succeed)' }}"
            echo "OpenAI write outcome: ${{ steps.write_openai.outcome || 'skipped (doctor did not succeed)' }}"
            echo ""
            echo "## doctor"
            echo '```'
            cat doctor-output.txt
            echo '```'
            echo ""
            echo "## call github.variable.put"
            echo '```'
            cat write-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call cloudflare.kv.namespace.create / cloudflare.kv.value.put"
            echo '```'
            cat write-cloudflare-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call neon.branch.create"
            echo '```'
            cat write-neon-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call vercel.env.set"
            echo '```'
            cat write-vercel-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call resend.email.send"
            echo '```'
            cat write-resend-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call clerk.invitation.create / clerk.invitation.revoke"
            echo '```'
            cat write-clerk-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
            echo ""
            echo "## call openai.validate.independent"
            echo '```'
            cat write-openai-output.txt 2>/dev/null || echo "(skipped)"
            echo '```'
          } > .status/doctor-last-run.md

      - name: Commit the status if it changed
        if: always()
        run: |
          git config user.name "stromex-mcp-doctor-bot"
          git config user.email "doctor@stromex-mcp.local"
          git add .status/doctor-last-run.md
          if git diff --cached --quiet; then
            echo "No change in doctor status."
          else
            git commit -m "StromeX MCP: doctor ${{ steps.doctor.outcome }}, writes gh=${{ steps.write.outcome || 'skipped' }} cf=${{ steps.write_cloudflare.outcome || 'skipped' }} neon=${{ steps.write_neon.outcome || 'skipped' }} vercel=${{ steps.write_vercel.outcome || 'skipped' }} resend=${{ steps.write_resend.outcome || 'skipped' }} clerk=${{ steps.write_clerk.outcome || 'skipped' }} openai=${{ steps.write_openai.outcome || 'skipped' }}"
            git push origin HEAD:${{ env.SOURCE_REF }}
          fi

      - name: Fail the job if the credential or any write failed
        if: |
          steps.doctor.outcome == 'failure' ||
          steps.write.outcome == 'failure' ||
          steps.write_cloudflare.outcome == 'failure' ||
          steps.write_neon.outcome == 'failure' ||
          steps.write_vercel.outcome == 'failure' ||
          steps.write_resend.outcome == 'failure' ||
          steps.write_clerk.outcome == 'failure' ||
          steps.write_openai.outcome == 'failure'
        run: exit 1
