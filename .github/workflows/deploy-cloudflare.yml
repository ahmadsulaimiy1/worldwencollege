# WEC-LC — deploy to Cloudflare Pages.
#
# Manual only (workflow_dispatch). It is deliberately not wired to
# `push`: until the repository holds real Cloudflare credentials this
# workflow cannot succeed, and a red X on every commit teaches people to
# ignore red Xs. Add a `push:` trigger once a deploy has run green by
# hand.
#
# WHAT IT NEEDS BEFORE IT CAN WORK — none of this can be created from
# the repository; all of it is done once in the Cloudflare dashboard and
# in this repository's Settings.
#
#   Repository secrets (Settings -> Secrets and variables -> Actions):
#     CLOUDFLARE_API_TOKEN    a token with "Cloudflare Pages: Edit",
#                             "D1: Edit" and "Workers R2 Storage: Edit"
#                             on the account
#     CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard sidebar
#     D1_DATABASE_ID          shown on the database's page in the
#                             dashboard, and printed by
#                             `wrangler d1 create wec-lc`. Substituted
#                             into wrangler.toml at deploy time so the
#                             placeholder never ships.
#
#   Optional, as EITHER a secret or a variable — the workflow accepts
#   both, so it does not matter which tab it was added under:
#     CLERK_PUBLISHABLE_KEY   without it the deployment is a design
#                             preview: the portal, the Listening Lab and
#                             the instructor workspace all render but
#                             every authenticated call returns 401.
#                             Publishable keys are not secret (they are
#                             embedded in every page that uses Clerk),
#                             so a variable is fine; a secret works too.
#
#   Pages secrets, set once with `wrangler pages secret put <NAME>` or in
#   the dashboard (these are read by the Functions at runtime, not here):
#     CLERK_JWKS_URL, CLERK_WEBHOOK_SECRET, STRIPE_SECRET_KEY,
#     STRIPE_WEBHOOK_SECRET, PAYSTACK_SECRET_KEY, FLW_SECRET_KEY,
#     FLW_WEBHOOK_SECRET_HASH, OPAY_*, RESEND_API_KEY,
#     RESEND_FROM_ADDRESS, NOTIFICATION_EMAIL
#   .env.example is the authoritative list.

name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Pages branch to deploy to. Anything other than the project’s production branch is a preview deployment with its own URL.'
        required: true
        default: 'preview'
      seed_database:
        description: 'Apply sql/schema.sql and all 12 seed files to the REMOTE D1 database first. Only for a brand-new database — the seeds are INSERTs and are not idempotent.'
        type: boolean
        required: true
        default: false
      apply_migrations:
        description: 'Bring the REMOTE D1 database up to date with sql/migrations/. Safe to leave on: the runner applies only what is missing, records the rest, and does nothing on a database that is already current. See scripts/migrate.mjs.'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  # The Executive directive is explicit that deployment does not skip
  # verification, so the deploy job depends on this one and a failure
  # here stops the deploy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static build
        run: npm run build
      # Chromium is installed BEFORE the backend suite, not after it.
      #
      # It used to sit further down, immediately above the tests/browser/
      # scripts, which was correct when only those needed a browser. It
      # stopped being correct when the publication work added PDF tests:
      # `npm test` auto-discovers tests/*.test.mjs, and both
      # publication-craft and publication-editions launch Chromium to
      # render and re-measure a real PDF. With the install below them
      # they crashed with "Executable doesn't exist", which reads like a
      # broken dependency and is really a step in the wrong order.
      #
      # It went unseen because it cannot reproduce locally: a developer
      # machine already has the browser, so the ordering only matters on
      # a clean runner.
      - name: Install Chromium — needed by the PDF suites as well as the browser ones
        run: npx playwright install --with-deps chromium
      - name: Backend suite
        run: npm test
      - name: Programme-wide curriculum consistency
        run: node --experimental-sqlite tests/curriculum-consistency.test.mjs
      - name: Route audit — every built route
        run: node tests/browser/route-audit.mjs
      - name: Listening Lab
        run: node tests/browser/listening-lab.mjs
      - name: Auth contract
        run: node tests/browser/lab-auth.mjs
      - name: Recording upload, end to end
        run: node tests/browser/recording-upload.mjs
      - name: Enrolment administration
        run: node tests/browser/admin-enrolments.mjs
      - name: My Programme — the route from signing in to a lesson
        run: node tests/browser/my-programme.mjs
      - name: Award verification — the portal a stranger opens
        run: node tests/browser/verify.mjs
      - name: The Graduate Register — the browsable roll
        run: node tests/browser/register.mjs
      - name: The graduate record
        run: node tests/browser/graduate.mjs
      - name: My Academic Record — what the learner controls
        run: node tests/browser/my-record.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-${{ inputs.branch }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Fail early with a useful message if configuration is missing
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$DB_ID" ]   || missing="$missing D1_DATABASE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not configured for Cloudflare yet. Missing:$missing — see the header of this workflow file."
            exit 1
          fi

      - name: Point wrangler.toml at the real D1 database
        env:
          # Via env rather than inlined into the script: an expression
          # expanded straight into a shell line is a script-injection
          # seam, and there is no reason to leave one open.
          DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          # The committed value is a placeholder on purpose: a database
          # id is account-specific and does not belong in git history.
          sed -i "s/REPLACE_WITH_REAL_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          if grep -q "REPLACE_WITH_REAL" wrangler.toml; then
            echo "::error::wrangler.toml still holds the placeholder — D1_DATABASE_ID did not substitute."
            exit 1
          fi

      - name: Set the Clerk publishable key, if one is configured
        env:
          # Accepts the key however it was added — secret or variable.
          PK: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PK" ]; then
            echo "::warning::No CLERK_PUBLISHABLE_KEY variable set. The site will deploy as a design preview — the Student Portal, Listening Lab and instructor workspace will render, but every authenticated API call returns 401. See docs/preview-deployment.md § 4."
          else
            printf 'window.WEC_LC_AUTH = {\n  clerkPublishableKey: %s\n};\n' "'$PK'" > js/auth-config.js
            echo "Clerk publishable key applied to js/auth-config.js"
          fi

      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `pages deploy` fails outright against a project that does not
          # exist, and creating one is interactive by default — so on a
          # first run this is the step between "configured correctly" and
          # an opaque error. Idempotent: create only if absent.
          if npx wrangler pages project list 2>/dev/null | grep -qw 'wec-lc'; then
            echo "Pages project wec-lc already exists."
          else
            echo "Creating Pages project wec-lc…"
            # Production branch is deliberately a branch that does not
            # exist in this repository. Every deploy from a real branch
            # is then a PREVIEW deploy with its own URL, which is what an
            # internal preview should be. Change this once the site is
            # meant to be publicly launched.
            npx wrangler pages project create wec-lc --production-branch=main
          fi

      - name: Ensure the recordings bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Same reasoning as the Pages project: wrangler.toml declares
          # the binding, but a binding to a bucket that does not exist
          # fails at deploy. Idempotent.
          #
          # Requires "Workers R2 Storage: Edit" on the API token. If that
          # permission is absent this step says so plainly instead of
          # letting the deploy fail later with a binding error.
          if npx wrangler r2 bucket list 2>/dev/null | grep -qw 'wec-lc-recordings'; then
            echo "R2 bucket wec-lc-recordings already exists."
            exit 0
          fi
          if npx wrangler r2 bucket create wec-lc-recordings 2>r2-error.log; then
            cat r2-error.log || true
            echo "Created R2 bucket wec-lc-recordings (private by default — never expose it publicly)."
            exit 0
          fi

          # Recording storage is one capability, not the deployment.
          # Refusing to deploy the whole platform because voice takes
          # cannot be stored is the wrong trade -- it would hold the
          # curriculum, the portal and authentication hostage to an
          # unrelated account setting. So: warn loudly, drop the binding
          # so the deploy is valid without it, and carry on.
          #
          # Nothing is silently broken by this. The application already
          # treats a missing RECORDINGS binding as a clear configuration
          # error at the point of use (see recording-storage.js), so a
          # learner gets an honest message rather than a take that
          # vanishes.
          cat r2-error.log || true
          if grep -q '10042' r2-error.log; then
            echo "::warning::R2 is not enabled on this Cloudflare account. Enable it once at Dashboard -> R2 (it asks for a payment method even for the free tier), then re-run this workflow. Deploying WITHOUT recording storage: learner voice recordings will report a configuration error instead of uploading. Everything else is unaffected."
          else
            echo "::warning::Could not create the R2 bucket -- most likely the API token is missing \"Workers R2 Storage: Edit\". Deploying WITHOUT recording storage; everything else is unaffected."
          fi

          # Remove the binding rather than leave it pointing at a bucket
          # that does not exist: `pages deploy` rejects that outright,
          # which would put us back to a blocked deployment.
          python3 - <<'PY'
          import re
          src = open('wrangler.toml').read()
          out = re.sub(r'\n\[\[r2_buckets\]\]\n(?:[^\[\n].*\n|\n(?=\s*[a-z_]+\s*=))*', '\n', src)
          assert '[[r2_buckets]]' not in out and '[[d1_databases]]' in out, 'wrangler.toml edit went wrong'
          open('wrangler.toml', 'w').write(out)
          print('Removed the r2_buckets binding for this deploy.')
          PY
          echo "R2_SKIPPED=1" >> "$GITHUB_ENV"

      - name: Apply schema and curriculum seeds to the remote D1 database
        if: ${{ inputs.seed_database }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler d1 execute wec-lc --remote --yes --file=sql/schema.sql
          # Curriculum before audio at each level: the audio rows carry
          # foreign keys onto that level's learning items.
          for n in 1 2 3 4 5 6; do
            npx wrangler d1 execute wec-lc --remote --yes --file=sql/seed-curriculum-level-$n.sql
            npx wrangler d1 execute wec-lc --remote --yes --file=sql/seed-audio-level-$n.sql
          done

      - name: Bring the remote D1 database up to date
        if: ${{ inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate-remote.mjs --remote
        # This used to be a shell loop applying every file in
        # sql/migrations/ unconditionally, guarded by "don't run this if
        # you just seeded". That is not a migration runner — it works on
        # exactly one database state and fails on every other, and ours
        # had two of three migrations applied, which made shipping the
        # third impossible.
        #
        # scripts/migrate.mjs keeps a ledger and applies only what is
        # missing, so this step is safe to leave on, safe to re-run, and
        # no longer needs a rule anyone has to remember. It is tested
        # against the four states a real database is in — see
        # tests/migrate.test.mjs, which also asserts that the old
        # behaviour genuinely fails, so the fix is measured against a
        # real failure rather than a hypothetical one.

      - name: Build
        run: npm run build

      - name: Publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy . \
            --project-name=wec-lc \
            --branch="${{ inputs.branch }}" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          # Say plainly, in the place people look, what this deployment
          # does NOT have. A capability quietly missing is worse than one
          # that announces itself.
          if [ "${R2_SKIPPED:-}" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Deployed without recording storage.** R2 was unavailable, so learner voice recordings will report a configuration error instead of uploading. Enable R2 in the Cloudflare dashboard and re-run to add it. Nothing else is affected." >> "$GITHUB_STEP_SUMMARY"
          fi
