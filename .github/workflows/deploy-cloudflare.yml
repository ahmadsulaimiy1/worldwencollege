# WEC-LC — deploy to Cloudflare Pages.
#
# Manual only (workflow_dispatch). It is deliberately not wired to
# `push`: until the repository holds real Cloudflare credentials this
# workflow cannot succeed, and a red X on every commit teaches people to
# ignore red Xs. Add a `push:` trigger once a deploy has run green by
# hand.
#
# WHAT IT NEEDS BEFORE IT CAN WORK — none of this can be created from
# the repository; all of it is done once in the Cloudflare dashboard and
# in this repository's Settings.
#
#   Repository secrets (Settings -> Secrets and variables -> Actions):
#     CLOUDFLARE_API_TOKEN    a token with "Cloudflare Pages: Edit",
#                             "D1: Edit" and "Workers R2 Storage: Edit"
#                             on the account
#     CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard sidebar
#     D1_DATABASE_ID          shown on the database's page in the
#                             dashboard, and printed by
#                             `wrangler d1 create wec-lc`. Substituted
#                             into wrangler.toml at deploy time so the
#                             placeholder never ships.
#
#   Optional, as EITHER a secret or a variable — the workflow accepts
#   both, so it does not matter which tab it was added under:
#     CLERK_PUBLISHABLE_KEY   without it the deployment is a design
#                             preview: the portal, the Listening Lab and
#                             the instructor workspace all render but
#                             every authenticated call returns 401.
#                             Publishable keys are not secret (they are
#                             embedded in every page that uses Clerk),
#                             so a variable is fine; a secret works too.
#
#   Pages secrets, set once with `wrangler pages secret put <NAME>` or in
#   the dashboard (these are read by the Functions at runtime, not here):
#     CLERK_JWKS_URL, CLERK_WEBHOOK_SECRET, STRIPE_SECRET_KEY,
#     STRIPE_WEBHOOK_SECRET, PAYSTACK_SECRET_KEY, FLW_SECRET_KEY,
#     FLW_WEBHOOK_SECRET_HASH, OPAY_*, RESEND_API_KEY,
#     RESEND_FROM_ADDRESS, NOTIFICATION_EMAIL
#   .env.example is the authoritative list.

name: Deploy to Cloudflare Pages

# ── WHY THERE IS NOW A push: TRIGGER ─────────────────────────────────
# This workflow was deliberately manual while the repository held no
# real Cloudflare credentials: a red X on every commit teaches people to
# ignore red Xs, and the header above committed to adding a push trigger
# "once a deploy has run green by hand". It has now run green by hand a
# dozen times in a row.
#
# Manual-only turned out to cost more than it avoided. Pushing did not
# deploy, and that is not a fact anyone holds in their head reliably —
# twice, work was described as live when nothing had been published.
# Deploying on push closes the gap between "committed" and "published".
#
# The verify job still gates the deploy, so a push with a failing suite
# publishes nothing. workflow_dispatch is kept for preview deployments
# and for re-running a deploy without a new commit.
on:
  push:
    branches:
      - main
      # ── WHY THIS LIST CHANGED ON 18 AUGUST 2026 ──────────────────────
      # It named `claude/worldwide-english-college-site-ezy1zo`, which
      # has since been rebranded to Albalagh International Premium
      # College — a separate institution that happens to share this
      # repository's history (CLAUDE.md §7, ruled by the owner). Leaving
      # it here meant one green test run on that branch would publish
      # another college to worldwencollege.co.uk. Its last three deploys
      # failed on their own verify job, which is the only reason that
      # did not already happen.
      #
      # The consequence of nobody noticing was the other half: this
      # College's work went to a branch that deploys nothing, and the
      # live site stayed at 940c5e30 from 16 August while ninety-six
      # commits accumulated behind it — the Library, the tuition ladder,
      # the commercial model, the Record of Standing, nine drawn plates.
      # That is the failure the header above warned about, in the exact
      # words it used: work described as live when nothing had been
      # published.
      - claude/world-wen-college-audit-ft3mls
    # A change that cannot affect what is served should not spend a
    # deploy. Everything else should.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # A push deploys to the Pages PRODUCTION branch — `main` — from either
  # git branch, because that is precisely what every manual deploy has
  # done, and it is what keeps worldwencollege.co.uk current. The
  # development work lives on a feature branch that has not been merged,
  # so making a push from it publish to `preview` instead would look
  # tidier and would quietly stop updating the live site. That is the
  # same class of failure as a green deploy that published nothing.
  #
  # To publish a preview instead, run the workflow by hand and set the
  # branch input to anything other than `main`.
  workflow_dispatch:
    inputs:
      branch:
        description: 'Pages branch to deploy to. Anything other than the project’s production branch is a preview deployment with its own URL.'
        required: true
        default: 'preview'
      seed_database:
        description: 'Apply sql/schema.sql and all 12 seed files to the REMOTE D1 database first. Only for a brand-new database — the seeds are INSERTs and are not idempotent.'
        type: boolean
        required: true
        default: false
      apply_migrations:
        description: 'Bring the REMOTE D1 database up to date with sql/migrations/. Safe to leave on: the runner applies only what is missing, records the rest, and does nothing on a database that is already current. See scripts/migrate.mjs.'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  # The Executive directive is explicit that deployment does not skip
  # verification, so the deploy job depends on this one and a failure
  # here stops the deploy.
  verify:
    runs-on: ubuntu-latest
    # A CEILING, BECAUSE A HUNG STEP IS INVISIBLE WITHOUT ONE.
    #
    # On 19 August 2026 the Chromium install stalled and the job sat
    # `in_progress` for over an hour. GitHub's default is SIX HOURS, so
    # nothing failed, nothing alerted, and the only symptom was a live
    # domain quietly serving the previous commit — which is the exact
    # class of fault tests/deploy-reach.test.mjs exists for, arriving
    # from the one direction that test cannot see.
    #
    # 30 minutes is roughly three times the eight-minute run this job
    # takes when it is healthy. A verify that needs longer than that has
    # something wrong with it, and finding out in half an hour is worth
    # more than finishing in five.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static build
        run: npm run build
      # Chromium is installed BEFORE the backend suite, not after it.
      #
      # It used to sit further down, immediately above the tests/browser/
      # scripts, which was correct when only those needed a browser. It
      # stopped being correct when the publication work added PDF tests:
      # `npm test` auto-discovers tests/*.test.mjs, and both
      # publication-craft and publication-editions launch Chromium to
      # render and re-measure a real PDF. With the install below them
      # they crashed with "Executable doesn't exist", which reads like a
      # broken dependency and is really a step in the wrong order.
      #
      # It went unseen because it cannot reproduce locally: a developer
      # machine already has the browser, so the ordering only matters on
      # a clean runner.
      # THE BROWSER, CACHED — AND BOUNDED WHEN IT IS NOT.
      #
      # This step takes about eighty seconds on a healthy runner and it
      # is pure download: the same browser build, fetched again, on
      # every push. Keyed on the Playwright version, so a version bump
      # invalidates it and nothing else does.
      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The system libraries are NOT cached — they are apt packages
      # installed outside the home directory, and they are cheap. Only
      # the browser download is skipped on a hit.
      # The system libraries, separately and allowed to fail.
      #
      # `--with-deps` bundles an apt install into the browser download,
      # so a stall in either looks identical from outside and neither can
      # be timed on its own. Split, each is diagnosable. And on
      # ubuntu-latest the libraries Chrome needs are already present —
      # this step is belt and braces, so it must not be able to fail the
      # build on its own.
      - name: Install the browser's system libraries
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium

      # THE BROWSER, AND A REAL FALLBACK WHEN IT CANNOT BE FETCHED.
      #
      # WHAT SPLITTING THE STEP REVEALED, AND IT WAS NOT WHAT I EXPECTED.
      # Three runs on 19 August 2026 died in `playwright install
      # --with-deps chromium` — the first hung for over an hour before
      # the timeout above existed, the next two failed at eight minutes
      # with a retry. Every comment written during that hunt blamed the
      # browser CDN, because that is the half of `--with-deps` anybody
      # thinks about.
      #
      # The first run after the split settled it: the apt step took
      # 5m13s and hit its own cap, and the browser download took TEN
      # SECONDS. The stall was entirely in the system libraries. The CDN
      # was never slow.
      #
      # That is why the two are separate and why the apt half is the one
      # marked continue-on-error: ubuntu-latest already carries what
      # Chrome needs, so it is belt and braces, and belt and braces must
      # never be able to stop a verified commit from reaching the domain.
      #
      # The fallback below stays regardless. The download is still an
      # external dependency, it is still the last thing in this job that
      # can block a deploy, and a diagnosis that turned out wrong once is
      # a good reason to keep the safety net rather than to trust the
      # new one completely.
      #
      # ubuntu-latest ships Google Chrome. Every browser suite in this
      # repository already resolves its executable through PW_CHROMIUM
      # (tests/browser/*.mjs, scripts/publication/render-*.mjs), so
      # pointing that at the preinstalled binary runs the SAME tests
      # against a real Chrome rather than skipping them.
      #
      # Skipping was considered and refused. A verify job that quietly
      # drops its browser suites when a download fails is a verify job
      # that publishes unverified work on exactly the days something is
      # wrong with the network — and the whole reason `deploy` needs
      # `verify` is to make that impossible.
      - name: Install Chromium — needed by the PDF suites as well as the browser ones
        id: browser
        timeout-minutes: 8
        continue-on-error: true
        run: npx playwright install chromium

      - name: Fall back to the runner's Chrome if the download failed
        if: steps.browser.outcome != 'success'
        run: |
          set -e
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "Playwright's download failed; using $candidate instead."
              echo "PW_CHROMIUM=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Playwright could not fetch Chromium and this runner has no Chrome to fall back on."
          echo "The browser suites cannot run, so nothing is verified and nothing may be published."
          exit 1
      - name: Backend suite
        run: npm test
      - name: Programme-wide curriculum consistency
        run: node --experimental-sqlite tests/curriculum-consistency.test.mjs
      - name: Route audit — every built route
        run: node tests/browser/route-audit.mjs
      - name: Listening Lab
        run: node tests/browser/listening-lab.mjs
      - name: Auth contract
        run: node tests/browser/lab-auth.mjs
      - name: Recording upload, end to end
        run: node tests/browser/recording-upload.mjs
      - name: Enrolment administration
        run: node tests/browser/admin-enrolments.mjs
      - name: My Programme — the route from signing in to a lesson
        run: node tests/browser/my-programme.mjs
      - name: Award verification — the portal a stranger opens
        run: node tests/browser/verify.mjs
      - name: The Graduate Register — the browsable roll
        run: node tests/browser/register.mjs
      - name: The graduate record
        run: node tests/browser/graduate.mjs
      - name: My Academic Record — what the learner controls
        run: node tests/browser/my-record.mjs
      - name: Track your application — the surface a person reaches before they are a learner
        run: node tests/browser/admissions-track.mjs
      - name: My Account — the statement of account, and the arithmetic under it
        run: node tests/browser/my-account.mjs
      - name: Where I Stand — and that no condition of the College's is charged to the learner
        run: node tests/browser/my-standing.mjs
      - name: My Week — times on the account's clock, and a list that agrees with the booking route
        run: node tests/browser/my-week.mjs
      - name: My Desk — that a notice addressed to somebody else never reaches the document
        run: node tests/browser/my-desk.mjs
      - name: My Cases — the appeal ladder, its clock, and the two acts that are the learner's
        run: node tests/browser/my-cases.mjs
      - name: My Engagement — that an empty window is never drawn as a failure
        run: node tests/browser/my-engagement.mjs
      - name: My Module — the study surface, and that the allowance is read before it is spent
        run: node tests/browser/my-module.mjs
      - name: Paying — the journey from an offer to an open level, and the screen a bank returns to
        run: node tests/browser/payment-complete.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-${{ inputs.branch || 'main' }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Fail early with a useful message if configuration is missing
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$DB_ID" ]   || missing="$missing D1_DATABASE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not configured for Cloudflare yet. Missing:$missing — see the header of this workflow file."
            exit 1
          fi

      - name: Point wrangler.toml at the real D1 database
        env:
          # Via env rather than inlined into the script: an expression
          # expanded straight into a shell line is a script-injection
          # seam, and there is no reason to leave one open.
          DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          # The committed value is a placeholder on purpose: a database
          # id is account-specific and does not belong in git history.
          sed -i "s/REPLACE_WITH_REAL_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          if grep -q "REPLACE_WITH_REAL" wrangler.toml; then
            echo "::error::wrangler.toml still holds the placeholder — D1_DATABASE_ID did not substitute."
            exit 1
          fi

      - name: Set the Clerk publishable key, if one is configured
        env:
          # Accepts the key however it was added — secret or variable.
          PK: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PK" ]; then
            echo "::warning::No CLERK_PUBLISHABLE_KEY variable set. The site will deploy as a design preview — the Student Portal, Listening Lab and instructor workspace will render, but every authenticated API call returns 401. See docs/preview-deployment.md § 4."
          else
            printf 'window.WEC_LC_AUTH = {\n  clerkPublishableKey: %s\n};\n' "'$PK'" > js/auth-config.js
            echo "Clerk publishable key applied to js/auth-config.js"
          fi

      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `pages deploy` fails outright against a project that does not
          # exist, and creating one is interactive by default — so on a
          # first run this is the step between "configured correctly" and
          # an opaque error. Idempotent: create only if absent.
          if npx wrangler pages project list 2>/dev/null | grep -qw 'wec-lc'; then
            echo "Pages project wec-lc already exists."
          else
            echo "Creating Pages project wec-lc…"
            # Production branch is deliberately a branch that does not
            # exist in this repository. Every deploy from a real branch
            # is then a PREVIEW deploy with its own URL, which is what an
            # internal preview should be. Change this once the site is
            # meant to be publicly launched.
            npx wrangler pages project create wec-lc --production-branch=main
          fi

      - name: Ensure the recordings bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Same reasoning as the Pages project: wrangler.toml declares
          # the binding, but a binding to a bucket that does not exist
          # fails at deploy. Idempotent.
          #
          # Requires "Workers R2 Storage: Edit" on the API token. If that
          # permission is absent this step says so plainly instead of
          # letting the deploy fail later with a binding error.
          if npx wrangler r2 bucket list 2>/dev/null | grep -qw 'wec-lc-recordings'; then
            echo "R2 bucket wec-lc-recordings already exists."
            exit 0
          fi
          if npx wrangler r2 bucket create wec-lc-recordings 2>r2-error.log; then
            cat r2-error.log || true
            echo "Created R2 bucket wec-lc-recordings (private by default — never expose it publicly)."
            exit 0
          fi

          # Recording storage is one capability, not the deployment.
          # Refusing to deploy the whole platform because voice takes
          # cannot be stored is the wrong trade -- it would hold the
          # curriculum, the portal and authentication hostage to an
          # unrelated account setting. So: warn loudly, drop the binding
          # so the deploy is valid without it, and carry on.
          #
          # Nothing is silently broken by this. The application already
          # treats a missing RECORDINGS binding as a clear configuration
          # error at the point of use (see recording-storage.js), so a
          # learner gets an honest message rather than a take that
          # vanishes.
          cat r2-error.log || true
          if grep -q '10042' r2-error.log; then
            echo "::warning::R2 is not enabled on this Cloudflare account. Enable it once at Dashboard -> R2 (it asks for a payment method even for the free tier), then re-run this workflow. Deploying WITHOUT recording storage: learner voice recordings will report a configuration error instead of uploading. Everything else is unaffected."
          else
            echo "::warning::Could not create the R2 bucket -- most likely the API token is missing \"Workers R2 Storage: Edit\". Deploying WITHOUT recording storage; everything else is unaffected."
          fi

          # Remove the binding rather than leave it pointing at a bucket
          # that does not exist: `pages deploy` rejects that outright,
          # which would put us back to a blocked deployment.
          python3 - <<'PY'
          import re
          src = open('wrangler.toml').read()
          out = re.sub(r'\n\[\[r2_buckets\]\]\n(?:[^\[\n].*\n|\n(?=\s*[a-z_]+\s*=))*', '\n', src)
          assert '[[r2_buckets]]' not in out and '[[d1_databases]]' in out, 'wrangler.toml edit went wrong'
          open('wrangler.toml', 'w').write(out)
          print('Removed the r2_buckets binding for this deploy.')
          PY
          echo "R2_SKIPPED=1" >> "$GITHUB_ENV"

      - name: Ensure the KYC documents bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Same reasoning and idempotency as the recordings bucket step
          # above, for the separate wec-lc-kyc-documents bucket. Kept as
          # its own step rather than folded into that one so a failure
          # here reports against KYC document upload specifically, not
          # against recordings.
          if npx wrangler r2 bucket list 2>/dev/null | grep -qw 'wec-lc-kyc-documents'; then
            echo "R2 bucket wec-lc-kyc-documents already exists."
            exit 0
          fi
          if npx wrangler r2 bucket create wec-lc-kyc-documents 2>r2-kyc-error.log; then
            cat r2-kyc-error.log || true
            echo "Created R2 bucket wec-lc-kyc-documents (private by default — never expose it publicly)."
            exit 0
          fi

          # Document upload is one optional step of the admissions
          # wizard, not the deployment. Warn loudly, drop only THIS
          # binding, and carry on — the same trade the recordings step
          # makes, and for the same reason.
          cat r2-kyc-error.log || true
          if grep -q '10042' r2-kyc-error.log; then
            echo "::warning::R2 is not enabled on this Cloudflare account. Enable it once at Dashboard -> R2, then re-run this workflow. Deploying WITHOUT KYC document upload: the optional identity-document step will report a configuration error instead of uploading. Everything else is unaffected."
          else
            echo "::warning::Could not create the R2 bucket -- most likely the API token is missing \"Workers R2 Storage: Edit\". Deploying WITHOUT KYC document upload; everything else is unaffected."
          fi

          # Remove ONLY the KYC_DOCUMENTS binding, matched by its exact
          # declared content rather than a generic "[[r2_buckets]]"
          # pattern — wrangler.toml carries two r2_buckets blocks now,
          # and a removal broad enough to match either would risk
          # dropping RECORDINGS on a KYC-only failure, or vice versa.
          python3 - <<'PY'
          import re
          src = open('wrangler.toml').read()
          block = '\n[[r2_buckets]]\nbinding = "KYC_DOCUMENTS"\nbucket_name = "wec-lc-kyc-documents"\n'
          assert block in src, 'wrangler.toml does not contain the expected KYC_DOCUMENTS block verbatim'
          out = src.replace(block, '\n')
          assert 'KYC_DOCUMENTS' not in out and '[[d1_databases]]' in out, 'wrangler.toml edit went wrong'
          open('wrangler.toml', 'w').write(out)
          print('Removed the KYC_DOCUMENTS r2_buckets binding for this deploy.')
          PY
          echo "KYC_R2_SKIPPED=1" >> "$GITHUB_ENV"

      - name: Apply schema and curriculum seeds to the remote D1 database
        # NEVER on a push. The seeds are INSERTs and are not idempotent,
        # so running them against a populated database is not a no-op.
        # A push carries no inputs, so this evaluates false and stays
        # false — seeding stays a decision somebody takes on purpose.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_database }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler d1 execute wec-lc --remote --yes --file=sql/schema.sql
          # Curriculum before audio at each level: the audio rows carry
          # foreign keys onto that level's learning items.
          for n in 1 2 3 4 5 6; do
            npx wrangler d1 execute wec-lc --remote --yes --file=sql/seed-curriculum-level-$n.sql
            npx wrangler d1 execute wec-lc --remote --yes --file=sql/seed-audio-level-$n.sql
          done

      - name: Bring the remote D1 database up to date
        # Safe by construction — scripts/migrate.mjs applies only what is
        # missing and does nothing on a database already current — so a
        # push gets it without having to be asked.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/migrate-remote.mjs --remote
        # This used to be a shell loop applying every file in
        # sql/migrations/ unconditionally, guarded by "don't run this if
        # you just seeded". That is not a migration runner — it works on
        # exactly one database state and fails on every other, and ours
        # had two of three migrations applied, which made shipping the
        # third impossible.
        #
        # scripts/migrate.mjs keeps a ledger and applies only what is
        # missing, so this step is safe to leave on, safe to re-run, and
        # no longer needs a rule anyone has to remember. It is tested
        # against the four states a real database is in — see
        # tests/migrate.test.mjs, which also asserts that the old
        # behaviour genuinely fails, so the fix is measured against a
        # real failure rather than a hypothetical one.

      - name: Build
        run: npm run build

      # ── ASSEMBLE WHAT SHIPS, RATHER THAN SHIPPING THE REPOSITORY ──
      #
      # `wrangler pages deploy .` uploads the working directory. All of
      # it. That put every internal directory on the public site:
      # docs/org-chart-placeholders.md — the eighteen invented staff
      # this project bans from publication and enforces with a test —
      # was readable at /docs/org-chart-placeholders.md, along with the
      # SQL seeds, the test suite and the build scripts.
      #
      # The ban test scans "served files" and skips docs/, tests/, sql/,
      # scripts/ and .github/ on the assumption that they are not
      # served. Nothing had ever checked that assumption against the
      # deploy, and it was false.
      #
      # Rather than trust an ignore-file whose support varies by
      # wrangler version, the site is COPIED into a staging directory
      # and that directory is what gets uploaded. The exclusion list
      # below is the same five directories the test skips, and
      # tests/deploy-surface.test.mjs now asserts the two lists match —
      # so the test's idea of "public" and the deploy's idea of "public"
      # cannot drift apart again.
      - name: Assemble the deploy surface
        run: |
          rm -rf .deploy && mkdir -p .deploy
          rsync -a --delete \
            --exclude='.deploy/' \
            --exclude='.render-audit/' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='sql/' \
            --exclude='scripts/' \
            --exclude='.github/' \
            --exclude='publication/*.docx' \
            --exclude='publication/.*' \
            --exclude='publication/IEFC Complete Curriculum.pdf' \
            --exclude='publication/IEFC Complete Curriculum (Student Edition).pdf' \
            --exclude='CLAUDE.md' \
            ./ .deploy/
          echo "Uploading $(find .deploy -type f | wc -l) files."
          if [ -d .deploy/docs ] || [ -d .deploy/sql ] || [ -d .deploy/tests ]; then
            echo "::error::Internal directories reached the deploy surface."; exit 1
          fi
          # THE LIBRARY IS NOW PART OF THE DEPLOY SURFACE.
          #
          # publication/ used to be excluded wholesale, on the reasoning
          # that the PDFs were "not linked from any page". That argument
          # sealed itself shut: nothing linked them because nothing
          # served them, so nothing could link them, so fourteen
          # finished volumes of the College's own academic work existed
          # only on the build machine. A college whose library is not
          # reachable has no library.
          #
          # Now excluded, precisely and for stated reasons:
          #   *.docx        editable masters, not publications
          #   .*            the staged HTML the PDFs are printed from
          #   two volumes   over Cloudflare's 25 MiB per-file ceiling
          #
          # Cloudflare Pages rejects any file over 25 MiB and fails the
          # WHOLE upload, not just that file, so the two oversized
          # curriculum editions stay off the surface and the Library
          # page says so in those words and offers them on request.
          # scripts/build-library.mjs computes that list from measured
          # file sizes, so this cannot drift from what the page claims.
          # The check below catches the next oversized file before
          # wrangler does, and names it.
          big=$(find .deploy -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::Files over Cloudflare's 25 MiB limit would fail the upload:"
            echo "$big"
            exit 1
          fi

      - name: Publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pipefail, and it is the most important line in this file.
          #
          # This was `wrangler pages deploy ... | tee deploy.log` with no
          # pipefail, so the step's exit status was tee's — always 0.
          # Run #11 hit "Pages only supports files up to 25 MiB", uploaded
          # nothing, and reported SUCCESS. Two production deploys were
          # announced as live having published nothing at all.
          #
          # A deploy that fails must fail the job. Without this line the
          # green tick means "tee ran", which is worth nothing.
          set -o pipefail
          npx wrangler pages deploy .deploy \
            --project-name=wec-lc \
            --branch="${{ inputs.branch || 'main' }}" \
            --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no deployment URL — nothing was published."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
          # Say plainly, in the place people look, what this deployment
          # does NOT have. A capability quietly missing is worse than one
          # that announces itself.
          if [ "${R2_SKIPPED:-}" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **Deployed without recording storage.** R2 was unavailable, so learner voice recordings will report a configuration error instead of uploading. Enable R2 in the Cloudflare dashboard and re-run to add it. Nothing else is affected." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── RESOLVED FROM TWO INDEPENDENT ATTEMPTS ─────────────────────
      #
      # Two sessions reached this same conclusion separately and each
      # wrote a check. The other looked for `class="footergrid` in the
      # response, which proves only "some build after the footer grid
      # landed" — it cannot tell a deploy from ten minutes ago from one
      # from last week, which is exactly the ambiguity the check exists
      # to remove. This one compares a per-commit stamp, so it answers
      # the precise question: is the domain serving THIS build?
      #
      # Two things the other version had and this one now keeps: a short
      # settle before fetching, because a Pages deploy is not instantly
      # global; and a look at the APEX domain as well as www, since the
      # two are separate records and either can be the one pointed
      # somewhere unexpected.
      # ── PROVE IT, RATHER THAN ANNOUNCE IT ───────────────────────────
      #
      # A green Publish step means wrangler uploaded files. It does NOT
      # mean the domain a visitor types is serving them, and the gap
      # between those two facts cost four rounds of "it deployed" /
      # "I still cannot see it" with nobody able to settle it.
      #
      # The gap is real and has three ordinary causes: the custom domain
      # is attached to a different Pages project; the project's
      # production branch is not the branch this deploy targets, making
      # every run a preview that never reaches the domain; or the CDN is
      # serving a cached copy.
      #
      # Every page now carries <meta name="wec-build"> with the commit it
      # was generated from, so all three are distinguishable from the
      # outside. This step fetches BOTH the pages.dev deployment and the
      # live domain, compares their stamps to the commit being deployed,
      # and says which link in the chain is broken rather than leaving it
      # to be guessed.
      #
      # It does not fail the job. A publish that genuinely succeeded
      # should not be reported as a failure because DNS is elsewhere —
      # but it must never again be reported as a success without saying
      # what the domain is actually serving.
      - name: Prove the live domain is serving this build
        if: always() && steps.publish.outcome == 'success'
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          want="${SHA:0:12}"
          echo "Expecting build stamp: $want"
          # A Pages deploy is not instantly global; give it a moment
          # before concluding anything about what the edge is serving.
          sleep 8

          stamp_of () {
            curl -fsSL --max-time 25 "$1" 2>/dev/null \
              | grep -o 'name="wec-build" content="[0-9a-f]*"' \
              | head -1 | sed 's/.*content="//; s/"//'
          }

          # The CDN is asked to skip its cache, so a stale answer here
          # means a stale ORIGIN rather than a stale edge.
          got_deploy=$(stamp_of "$DEPLOY_URL/?cb=$want")
          got_live=$(stamp_of "https://www.worldwencollege.co.uk/?cb=$want")
          # The apex and www are separate DNS records, and either can be
          # the one pointed somewhere unexpected. If www says nothing,
          # the apex is the second opinion worth having.
          got_apex=$(stamp_of "https://worldwencollege.co.uk/?cb=$want")
          [ -z "$got_live" ] && got_live="$got_apex"
          echo "  apex worldwencollege.co.uk -> ${got_apex:-<none>}"

          echo "  deployment $DEPLOY_URL -> ${got_deploy:-<none>}"
          echo "  live domain www.worldwencollege.co.uk -> ${got_live:-<none>}"

          {
            echo "### Deployment proof"
            echo ""
            echo "| Surface | Build stamp | Verdict |"
            echo "|---|---|---|"
            if [ "$got_deploy" = "$want" ]; then
              echo "| This deployment | \`$got_deploy\` | matches |"
            else
              echo "| This deployment | \`${got_deploy:-none}\` | **does not match \`$want\`** |"
            fi
            if [ "$got_live" = "$want" ]; then
              echo "| worldwencollege.co.uk | \`$got_live\` | **live and current** |"
            else
              echo "| worldwencollege.co.uk | \`${got_live:-none}\` | **NOT serving this build** |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$got_live" = "$want" ]; then
            echo "::notice::The live domain is serving this build ($want)."
            exit 0
          fi

          if [ -z "$got_live" ]; then
            echo "::warning::Could not read a build stamp from the live domain. Either it is unreachable from the runner, or it is serving a build made before the stamp existed."
          fi
          if [ "$got_deploy" = "$want" ] && [ "$got_live" != "$want" ]; then
            echo "::warning::THE PUBLISH WORKED AND THE DOMAIN DID NOT FOLLOW. The files are live at $DEPLOY_URL but www.worldwencollege.co.uk is serving ${got_live:-something else}. Check, in this order: (1) Cloudflare Dashboard -> Workers & Pages -> wec-lc -> Custom domains: is worldwencollege.co.uk attached to THIS project? (2) Settings -> Builds & deployments -> Production branch: it must be 'main', which is the branch this workflow deploys to — if it is anything else every run here is a PREVIEW and the domain will never update. (3) Caching -> Purge Everything."
            {
              echo "**The publish worked and the domain did not follow.** Files are live at \`$DEPLOY_URL\`."
              echo ""
              echo "Check in this order:"
              echo "1. **Workers & Pages -> wec-lc -> Custom domains** — is \`worldwencollege.co.uk\` attached to *this* project?"
              echo "2. **Settings -> Builds & deployments -> Production branch** — must be \`main\`. If it is anything else, every run here is a *preview* and the domain never updates."
              echo "3. **Caching -> Purge Everything.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
